<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cs-study 答题</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --border: #e2e0d8;
  --accent: #3b5bdb; --accent-soft: #e8ecfd; --ok: #2b8a3e; --ok-soft: #e6f4ea;
  --warn: #b35c00; --warn-soft: #fdf1e2; --bad: #c92a2a; --bad-soft: #fdeaea;
  --code-bg: #f0efe9; --term-bg: #1e1f22; --term-text: #d8dee4; --term-dim: #8b949e;
  --radius: 10px;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --syn-kw: #7c3aed; --syn-str: #1f7a3a; --syn-com: #8a8880; --syn-num: #b35c00; --syn-def: #3b5bdb; --syn-builtin: #0e7490;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --syn-kw: #c4a7ff; --syn-str: #8fd19e; --syn-com: #7d7b74; --syn-num: #f0a44b; --syn-def: #8ea4ff; --syn-builtin: #67d4e8;
  }
}
:root[data-theme="dark"] {
  --syn-kw: #c4a7ff; --syn-str: #8fd19e; --syn-com: #7d7b74; --syn-num: #f0a44b; --syn-def: #8ea4ff; --syn-builtin: #67d4e8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1d1d1d; --text: #e9e7e1; --muted: #9a988f; --border: #2f2e2b;
    --accent: #8ea4ff; --accent-soft: #232a45; --ok: #69c47c; --ok-soft: #1c2e21;
    --warn: #f0a44b; --warn-soft: #33261a; --bad: #ff7b7b; --bad-soft: #3a1f1f;
    --code-bg: #262624; --term-bg: #0d0e10;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1d1d1d; --text: #e9e7e1; --muted: #9a988f; --border: #2f2e2b;
  --accent: #8ea4ff; --accent-soft: #232a45; --ok: #69c47c; --ok-soft: #1c2e21;
  --warn: #f0a44b; --warn-soft: #33261a; --bad: #ff7b7b; --bad-soft: #3a1f1f;
  --code-bg: #262624; --term-bg: #0d0e10;
}
* { box-sizing: border-box; }
/* WHY: 给元素设了 display（grid/flex）之后，浏览器默认的 [hidden] 就失效了，标签页会叠在一起显示。 */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 0 16px 80px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
header.top .inner { max-width: 860px; margin: 0 auto; padding: 14px 16px 12px; }
h1 { font-size: 20px; margin: 0; }
.source { color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface);
  display: grid; place-items: center; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: none; }
.dot.pass { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dot.partial { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.dot.fail { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.dot.pending { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; margin-top: 18px; scroll-margin-top: 110px; }
.card-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.qno { font-weight: 700; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--code-bg); color: var(--muted); }
.tag.level { background: var(--accent-soft); color: var(--accent); }
.prompt p { margin: 0 0 8px; }
code { font-family: var(--mono); font-size: 0.92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { font-family: var(--mono); font-size: 13px; background: var(--code-bg); padding: 10px 12px; border-radius: 8px;
  overflow-x: auto; margin: 8px 0; white-space: pre; }
pre code { background: none; padding: 0; }
.options { display: grid; gap: 8px; margin: 10px 0; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; cursor: pointer; }
.option:hover { border-color: var(--accent); }
.option input { margin-top: 5px; }
.option .letter { font-weight: 700; color: var(--muted); min-width: 16px; }
.option.picked { border-color: var(--accent); background: var(--accent-soft); }
input.blank { font: inherit; border: none; border-bottom: 2px solid var(--accent); background: var(--accent-soft);
  color: var(--text); padding: 0 6px; min-width: 90px; width: 9em; border-radius: 4px 4px 0 0; }
textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 10px 12px; resize: vertical; }
textarea.code { font-family: var(--mono); font-size: 13px; line-height: 1.5; min-height: 260px; tab-size: 4; white-space: pre; }
textarea:focus, input.blank:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
button { font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #111; } }
button:disabled { opacity: 0.5; cursor: default; }
.hint { color: var(--muted); font-size: 13px; }
.term { background: var(--term-bg); color: var(--term-text); border-radius: 8px; font-family: var(--mono); font-size: 13px;
  padding: 10px 12px; margin-top: 10px; }
.term .out { max-height: 340px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.term .cmd { color: #7ee787; }
.term .dim { color: var(--term-dim); }
.term .line { display: flex; gap: 6px; align-items: center; }
.term .ps { color: #7ee787; }
.term input { flex: 1; background: transparent; border: none; color: var(--term-text); font: inherit; outline: none; padding: 2px 0; }
.result { margin-top: 14px; border-radius: 8px; padding: 10px 14px; border-left: 4px solid var(--border); background: var(--code-bg); }
.result.pass { border-color: var(--ok); background: var(--ok-soft); }
.result.partial { border-color: var(--warn); background: var(--warn-soft); }
.result.fail { border-color: var(--bad); background: var(--bad-soft); }
.result.pending { border-color: var(--accent); background: var(--accent-soft); }
.result .score { font-weight: 700; }
.result ul { margin: 6px 0; padding-left: 20px; }
.result .explain { margin-top: 6px; }
.output { max-height: 280px; overflow: auto; }
.summary { text-align: center; }
.summary .big { font-size: 28px; font-weight: 700; }
.summary .exam-note { margin: 6px 0 10px; }
.result .grading-sec { margin-top: 10px; }
.result .grading-h { font-weight: 700; margin-bottom: 4px; }
.result .md-table td.pts { white-space: nowrap; font-weight: 600; }
.ws-runs { font-size: 13px; font-weight: 600; }
.ws-runs.low { color: var(--bad); }
.lesson-list a { display: block; padding: 12px 16px; margin-top: 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); text-decoration: none; }
.lesson-list a:hover { border-color: var(--accent); }
.error { color: var(--bad); }

/* ---------- 代码题工作区：卡片里是小窗，点「展开」变成全屏，同一个编辑器 ---------- */
.ws { display: grid; grid-template-areas: "main" "side"; gap: 10px; margin-top: 6px; }
.ws-bar, .ws-prompt { display: none; }
.ws-main { grid-area: main; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.ws-side { grid-area: side; min-width: 0; }
.ws-editor { height: var(--ed-h, 360px); border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.ws-editor:focus-within { border-color: var(--accent); }
.ws-editor textarea.code { height: 100%; border: none; border-radius: 0; min-height: 0; resize: none; }
.ws-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ws-status { font-size: 13px; }
.ws-status.ok { color: var(--ok); font-weight: 600; }
.ws-status.bad { color: var(--bad); font-weight: 600; }
.test { border: 1px solid var(--border); border-left: 4px solid var(--ok); border-radius: 6px; padding: 6px 10px; background: var(--surface); }
.test.failed, .test.error { border-left-color: var(--bad); }
.test-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.test-name { font-family: var(--mono); font-size: 13px; }
.test pre { margin: 6px 0 2px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.line-link { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--bad); color: var(--bad);
  background: var(--bad-soft); cursor: pointer; }
.ws-history summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.ws-history ol { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; }
.ws-history li { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 8px; border-radius: 6px; background: var(--code-bg); }
.ws-history li .n { font-family: var(--mono); color: var(--muted); min-width: 28px; }
.ws-history li .res.ok { color: var(--ok); }
.ws-history li .res.bad { color: var(--bad); }
.ws-history li button { margin-left: auto; font-size: 12px; padding: 1px 10px; }
.ws-draft { font-size: 12px; color: var(--warn); }

.ws.expanded { position: fixed; inset: 0; z-index: 50; background: var(--bg); margin: 0; padding: 12px 16px 16px;
  grid-template-areas: "bar bar" "side main"; grid-template-columns: minmax(280px, 34%) 1fr; grid-template-rows: auto 1fr; gap: 12px 16px; }
.ws.expanded .ws-bar { grid-area: bar; display: flex; gap: 12px; align-items: center; }
.ws.expanded .ws-bar .spacer { flex: 1; }
.ws.expanded .ws-prompt { display: block; }
.ws.expanded .ws-side { overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.ws.expanded .ws-history[open], .ws.expanded .ws-history { margin-top: 12px; }
.ws.expanded .ws-main { gap: 8px; }
.ws.expanded .ws-editor { flex: 0 0 auto; height: var(--ed-h-exp, 56vh); }
.ws.expanded .rt { flex: 1 1 auto; min-height: 90px; max-height: none; }
@media (max-width: 760px) {
  .ws.expanded { grid-template-areas: "bar" "side" "main"; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 28vh) 1fr; }
}

/* 分隔条：拖动调整编辑器高度 */
.ws-split { height: 8px; margin: -6px 0 -4px; cursor: row-resize; display: grid; place-items: center; touch-action: none; }
.ws-split::after { content: ""; width: 44px; height: 4px; border-radius: 2px; background: var(--border); }
.ws-split:hover::after { background: var(--accent); }

/* 结果面板：终端输出（权威） + 错误分组（辅助） */
.rt { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  max-height: 380px; background: var(--surface); }
.rt-tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: var(--code-bg); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.rt-tab { border: none; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); padding: 5px 12px; font-size: 13px; }
.rt-tab.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 0 var(--surface); }
.rt-term { flex: 1 1 auto; overflow: auto; background: var(--term-bg); color: var(--term-text); font-family: var(--mono);
  font-size: 12.5px; line-height: 1.5; padding: 8px 12px; min-height: 0; }
.rt-term .t-line { white-space: pre; }
.rt-term .t-err { color: #ff8b8b; }
.rt-term .t-fail { color: #ff8b8b; }
.rt-term .t-pass { color: #7ee787; }
.rt-term .t-rule { color: var(--term-dim); }
.rt-term .t-caret { color: #d29922; }
.rt-term .t-link { color: #79c0ff; text-decoration: underline; cursor: pointer; }
.rt-groups { flex: 1 1 auto; overflow: auto; padding: 10px 12px; display: grid; gap: 10px; align-content: start; min-height: 0; }
.grp { border: 1px solid var(--border); border-left: 4px solid var(--bad); border-radius: 6px; padding: 8px 12px; }
.grp.ok { border-left-color: var(--ok); color: var(--ok); }
.grp-head { display: flex; gap: 8px; align-items: baseline; }
.grp-n { font-weight: 700; }
.grp-err { margin: 6px 0; font-size: 12.5px; white-space: pre-wrap; color: var(--bad); background: var(--bad-soft); }
.grp-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
.grp-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 2px 0; }
.grp-row code { font-size: 12.5px; }
.grp-passed { font-size: 13px; }
.grp-test { padding: 4px 0; border-top: 1px dashed var(--border); }
.grp-test:first-of-type { border-top: none; }
.grp-test-err { margin: 2px 0 0; padding: 4px 8px; font-size: 12px; color: var(--bad); background: transparent; white-space: pre-wrap; }

/* ---------- Markdown ---------- */
.md-h { font-size: 15px; margin: 14px 0 6px; }
.md-table { overflow-x: auto; margin: 8px 0; }
.md-table table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
.md-table th, .md-table td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
.md-table th { background: var(--code-bg); }

/* ---------- 课程页（D-010）：左边目录，右边当前小节 ---------- */
main.wide { max-width: 1180px; }
.budget { display: flex; gap: 12px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.budget-bar { flex: 1 1 auto; height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; min-width: 60px; }
.budget-bar > div { height: 100%; background: var(--ok); }
.budget .warn { color: var(--warn); font-weight: 600; }
.course { display: grid; grid-template-columns: 240px 1fr; gap: 18px; margin-top: 16px; align-items: start; }
.toc { position: sticky; top: 100px; max-height: calc(100vh - 116px); overflow-y: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 8px; font-size: 14px; }
.toc-part { font-weight: 700; font-size: 13px; color: var(--muted); margin: 10px 8px 4px; }
.toc-part:first-child { margin-top: 2px; }
.toc a { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--text); text-decoration: none; }
.toc a:hover { background: var(--code-bg); }
.toc a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .mark { width: 16px; flex: 0 0 16px; color: var(--muted); }
.toc a.done .mark { color: var(--ok); }
.toc .t { flex: 1; }
.toc .m { font-size: 12px; color: var(--muted); white-space: nowrap; }
.toc .later { margin: 12px 8px 4px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
.toc .later ul { padding-left: 16px; margin: 4px 0 0; }
.lesson { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; min-width: 0; scroll-margin-top: 130px; }
.sec-meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.lesson h2 { margin: 6px 0 12px; font-size: 21px; }
.lesson h3 { font-size: 15px; margin: 22px 0 8px; }
.goal { background: var(--accent-soft); color: var(--text); border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; }
.goal b { color: var(--accent); }
.try { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: step; }
.try li { counter-increment: step; display: grid; grid-template-columns: 26px 1fr; gap: 4px 8px; }
.try li::before { content: counter(step); grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--code-bg);
  display: grid; place-items: center; font-size: 12px; color: var(--muted); margin-top: 5px; }
.cmd { display: flex; align-items: stretch; background: var(--term-bg); border-radius: 6px; overflow: hidden; }
.cmd code { flex: 1; background: none; color: var(--term-text); padding: 7px 10px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
.cmd button { border: none; border-left: 1px solid #333; border-radius: 0; background: transparent; color: var(--term-dim); font-size: 12px; padding: 0 10px; }
.cmd button:hover { color: var(--term-text); }
.expect { font-size: 14px; color: var(--muted); }
.expect b { color: var(--text); font-weight: 600; }
.pit { border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
.pit .row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 3px 0; align-items: baseline; }
.pit .k { font-size: 12px; color: var(--muted); }
.pit pre { margin: 0; white-space: pre-wrap; font-size: 12.5px; }
.deeper { margin-top: 18px; font-size: 14px; }
.deeper summary { cursor: pointer; color: var(--muted); }
.deeper ul { margin: 6px 0; }
.sec-nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); }
.sec-nav .spacer { flex: 1; }
.finish { text-align: left; }
.finish ol { margin: 8px 0 14px; }
.toc > summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 8px 6px; list-style: none; }
.toc > summary::-webkit-details-marker { display: none; }
@media (max-width: 700px) {
  .course { grid-template-columns: 1fr; }
  .toc { position: static; max-height: none; }
  .lesson { padding: 16px; }
}
.unit-list a { display: block; padding: 12px 16px; margin-top: 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); text-decoration: none; }
.unit-list a:hover { border-color: var(--accent); }
.index-h { font-size: 15px; margin: 22px 0 0; color: var(--muted); }

/* ---------- 课程页 v2（D-013 ~ D-017）：讲解 | 练习场终端 ---------- */
main.wide { max-width: 1560px; }
.course.has-lab { grid-template-columns: 220px minmax(0, 1fr) minmax(360px, 40%); }
.labterm { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 6px; height: calc(100vh - 116px); min-width: 0; }
.labterm .lab-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.labterm .lab-head button { font-size: 12.5px; padding: 3px 10px; }
.labterm .spacer { flex: 1; }
.labterm .lab-where { font-size: 12px; overflow-wrap: anywhere; }
.labterm .term { flex: 1 1 auto; display: flex; flex-direction: column; margin-top: 0; min-height: 0; cursor: text; }
.labterm .term .out { flex: 1 1 auto; max-height: none; }
.term .warn { color: #f0a44b; }
.term .ps { white-space: nowrap; }
.term .ps.outside { color: #f0a44b; }
@media (max-width: 1100px) {
  .course.has-lab { grid-template-columns: minmax(0, 1fr) minmax(320px, 42%); }
  .course.has-lab .toc { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 760px) {
  .course.has-lab { grid-template-columns: 1fr; }
  .labterm { position: static; height: 60vh; }
}
.toc a.skipped .mark { color: var(--warn); }
.load-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
.load-dot.l-低 { background: var(--ok); } .load-dot.l-中 { background: var(--warn); } .load-dot.l-高 { background: var(--bad); }
.sec-meta .load { padding: 0 8px; border-radius: 999px; }
.sec-meta .load.l-低 { background: var(--ok-soft); color: var(--ok); }
.sec-meta .load.l-中 { background: var(--warn-soft); color: var(--warn); }
.sec-meta .load.l-高 { background: var(--bad-soft); color: var(--bad); }

/* 暂停与回来（D-027） */

/* 备课面板（D-032） */

/* 学习记录（D-027） */

/* ---------- 知识树（D-020） ---------- */
.kg { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; margin-top: 16px; align-items: start; }

.kg-node.k-term { font-family: var(--mono); }
.kg-node.s-mastered { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.kg-node.s-weak { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.kg-node.s-stale { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.kg-node.s-learning { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.kg-node.s-new { color: var(--muted); border-style: dashed; }

@media (max-width: 900px) { .kg { grid-template-columns: 1fr; } .kg-detail { position: static; } }

/* WHY: 关掉连字。Cascadia Code 等字体会把 <= 显示成 ≤、-> 显示成 →，学写代码时看到的和实际敲的不一样。 */
.CodeMirror, pre, code, textarea.code, .term { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.CodeMirror { height: 100%; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; background: var(--surface); color: var(--text); }
.CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--border); }
.CodeMirror-linenumber { color: var(--muted); padding: 0 8px 0 6px; }
.CodeMirror-cursor { border-left: 2px solid var(--text); }
.CodeMirror-activeline-background { background: var(--accent-soft); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.CodeMirror-matchingbracket { color: var(--ok) !important; font-weight: 700; }
.cm-keyword { color: var(--syn-kw); } .cm-string { color: var(--syn-str); } .cm-comment { color: var(--syn-com); font-style: italic; }
.cm-number { color: var(--syn-num); } .cm-def { color: var(--syn-def); } .cm-builtin { color: var(--syn-builtin); }
.cm-variable, .cm-variable-2, .cm-property, .cm-operator, .cm-punctuation { color: var(--text); }
.cm-fail-line { background: var(--bad-soft) !important; }
.cm-fail-gutter .CodeMirror-linenumber { color: var(--bad); font-weight: 700; }
.cm-flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--bad) 45%, transparent); } }
</style>

<body>
<header class="top"><div class="inner" id="top"><h1>cs-study</h1></div></header>
<main id="app"></main>
<script>
const TOKEN = "__TOKEN__";
const params = new URLSearchParams(location.search);
const REF = params.get("lesson");
const RETAKE = params.get("retake") === "1";
const CHECKER_NAMES = { choice: "选择", fill: "填空", code: "代码", terminal: "终端", short: "简答" };
const state = {};   // qid -> previous/result
const drafts = {};  // 整卷模式：qid -> 交卷前的作答（null = 没答）
const cards = {};   // qid -> { view, showResult }

// ---------- 工具 ----------
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
};
// replaceChildren 不会跳过 null / undefined，会把它们当成文字 "null" 插进页面，所以统一走这里。
const fill = (el, ...kids) => el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inlineMd(s) {
  // 行内：代码、粗体、链接。先转义再替换，链接只接受 http(s)。
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(text, blankFactory) {
  // 小型 Markdown：代码块、标题、列表、表格、段落，外加行内格式。blankFactory 用来把 ____ 换成输入框占位符。
  const parts = String(text ?? "").split(/```[a-zA-Z]*\n?/);
  let html = "", blank = 0;
  const isUl = l => /^\s*[-*]\s+/.test(l), isOl = l => /^\s*\d+[.)]\s+/.test(l);
  const isRow = l => /^\s*\|.*\|\s*$/.test(l), isHead = l => /^#{1,4}\s+/.test(l);
  parts.forEach((part, pi) => {
    if (pi % 2 === 1) { html += `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`; return; }
    const lines = part.split("\n");
    let out = "", i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (isHead(l)) { out += `<h4 class="md-h">${inlineMd(l.replace(/^#{1,4}\s+/, ""))}</h4>`; i++; continue; }
      if (isUl(l) || isOl(l)) {
        const ordered = isOl(l), items = [];
        while (i < lines.length && lines[i].trim() && (ordered ? isOl(lines[i]) : isUl(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
          const t = lines[i];
          if (/^\s{2,}\S/.test(t) && !(ordered ? isOl(t) : isUl(t)) && items.length) items[items.length - 1] += " " + t.trim();
          else items.push(t.replace(ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*]\s+/, ""));
          i++;
        }
        const tag = ordered ? "ol" : "ul";
        out += `<${tag}>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</${tag}>`;
        continue;
      }
      if (isRow(l)) {
        const rows = [];
        while (i < lines.length && isRow(lines[i])) { rows.push(lines[i]); i++; }
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
        const [head, ...rest] = body;
        out += `<div class="md-table"><table><thead><tr>${cells(head).map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead>` +
               `<tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !isHead(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isRow(lines[i])) { para.push(lines[i]); i++; }
      out += `<p>${para.map(inlineMd).join("<br>")}</p>`;
    }
    if (blankFactory) out = out.replace(/____/g, () => `<span data-blank="${blank++}"></span>`);
    html += out;
  });
  return html;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Study-Token": TOKEN }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- 结果 ----------
function resultBox(r) {
  const cls = r.result || "pending";
  const label = r.result === "pending" ? "⏳ 已提交，等批改（LLM 没批成，导师会批）"
    : `${r.result === "pass" ? "✅" : r.result === "partial" ? "🟡" : "❌"} 得分 ${Math.round(r.score * 100)}%`;
  const box = $("div", { class: `result ${cls}` }, $("div", { class: "score" }, label));
  const fb = (r.feedback || []).filter(Boolean);
  if (fb.length && r.result !== "pending") box.append($("ul", {}, fb.map(f => $("li", {}, f))));
  if (r.rubric?.length && r.result !== "pending") { appendGrading(box, r); return box; }
  if (r.note && r.result !== "pending") box.append($("div", {}, "导师批注：" + r.note));
  if (r.explain) box.append($("div", { class: "explain", html: "<b>解析：</b>" + md(r.explain) }));
  return box;
}

// 简答题批改后（F-051）：标准答案 → 逐条批改（评分点 · 得分 · 你的回答对上了什么 / 缺了什么）→ 总评
function appendGrading(box, r) {
  const byId = Object.fromEntries((r.items || []).map(it => [it.id, it]));
  const weight = t => (String(t).match(/[（(]\s*(\d*\.?\d+)\s*[）)]\s*$/) || [])[1];
  const point = t => String(t).replace(/[（(]\s*\d*\.?\d+\s*[）)]\s*$/, "");
  const rows = r.rubric.map((t, i) => {
    const it = byId[i + 1], w = weight(t);
    const pts = it ? `${it.score}${w ? " / " + w : "（加分）"}` : (r.items?.length ? `0${w ? " / " + w : "（加分）"}` : (w ? `满分 ${w}` : "加分项"));
    return `<tr><td>${inlineMd(point(t))}</td><td class="pts">${esc(pts)}</td><td>${it ? inlineMd(it.why || "") : (r.items?.length ? "没有对上" : "")}</td></tr>`;
  }).join("");
  const by = r.graded_by === "short-grader" ? "LLM 总评" : "导师批注";
  box.append(
    r.explain ? $("div", { class: "grading-sec" }, $("div", { class: "grading-h" }, "标准答案"), $("div", { class: "explain", html: md(r.explain) })) : null,
    $("div", { class: "grading-sec" }, $("div", { class: "grading-h" }, "逐条批改"),
      $("div", { class: "md-table", html: `<table><thead><tr><th>评分点</th><th>得分</th><th>你的回答</th></tr></thead><tbody>${rows}</tbody></table>` })),
    r.note ? $("div", { class: "grading-sec" }, $("div", { class: "grading-h" }, by), $("div", { html: inlineMd(r.note) })) : null);
}

// ---------- 代码编辑器：有 CodeMirror 就用（行号、高亮），加载失败退回普通文本框 ----------
function makeEditor(host, value, { onRun, onEscape, onChange }) {
  if (window.CodeMirror) {
    const cm = CodeMirror(host, {
      value, mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
      matchBrackets: true, styleActiveLine: true, screenReaderLabel: "代码编辑器",
      extraKeys: {
        Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    "),
        "Shift-Tab": "indentLess",
        "Ctrl-Enter": () => onRun(), "Cmd-Enter": () => onRun(),
        Esc: () => onEscape(),
      },
    });
    let marked = [];
    cm.on("change", () => { onChange(cm.getValue()); clearMarks(); });
    function clearMarks() {
      marked.forEach(h => { cm.removeLineClass(h, "background", "cm-fail-line"); cm.removeLineClass(h, "gutter", "cm-fail-gutter"); });
      marked = [];
    }
    // WHY: 卡片插入页面之前 CodeMirror 量不到尺寸，挂上去后要刷新一次，否则行号栏是空的。
    requestAnimationFrame(() => cm.refresh());
    return {
      get: () => cm.getValue(),
      set: v => cm.setValue(v),
      focus: () => cm.focus(),
      refresh: () => setTimeout(() => cm.refresh(), 0),
      readOnly: () => cm.setOption("readOnly", true),
      markLines(lines) {
        clearMarks();
        lines.forEach(n => {
          if (n < 1 || n > cm.lineCount()) return;
          const h = cm.addLineClass(n - 1, "background", "cm-fail-line");
          cm.addLineClass(n - 1, "gutter", "cm-fail-gutter");
          marked.push(h);
        });
      },
      jump(n) {
        cm.focus();
        cm.setCursor({ line: n - 1, ch: 0 });
        cm.scrollIntoView({ line: n - 1, ch: 0 }, 80);
        const h = cm.addLineClass(n - 1, "wrap", "cm-flash");
        setTimeout(() => cm.removeLineClass(h, "wrap", "cm-flash"), 1200);
      },
    };
  }
  const area = $("textarea", { class: "code", spellcheck: "false", "aria-label": "代码编辑器" });
  area.value = value;
  area.addEventListener("input", () => onChange(area.value));
  area.addEventListener("keydown", e => {
    if (e.key === "Tab") { e.preventDefault(); area.setRangeText("    ", area.selectionStart, area.selectionEnd, "end"); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onRun(); }
  });
  host.append(area);
  return {
    get: () => area.value, set: v => { area.value = v; }, focus: () => area.focus(), refresh() {},
    readOnly: () => { area.readOnly = true; }, markLines() {},
    jump(n) {
      const lines = area.value.split("\n");
      const pos = lines.slice(0, n - 1).reduce((a, l) => a + l.length + 1, 0);
      area.focus(); area.setSelectionRange(pos, pos + (lines[n - 1] || "").length);
    },
  };
}

// ---------- 检验器界面：每种一个渲染函数，接口相同 ----------
// render(q, ui) 返回 { body, collect(), lock() }；ui.act(action) 走 /api/act。
const RENDERERS = {
  choice(q) {
    const type = q.multi ? "checkbox" : "radio";
    const inputs = [];
    const list = $("div", { class: "options" }, q.options.map((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const input = $("input", { type, name: q.id, value: letter });
      inputs.push(input);
      const row = $("label", { class: "option" }, input, $("span", { class: "letter" }, letter), $("span", { html: md(opt).replace(/^<p>|<\/p>$/g, "") }));
      input.addEventListener("change", () => inputs.forEach(x => x.closest(".option").classList.toggle("picked", x.checked)));
      return row;
    }));
    const prev = q.previous?.response ?? q.draft;
    if (Array.isArray(prev)) inputs.forEach(x => { x.checked = prev.includes(x.value); x.dispatchEvent(new Event("change")); });
    return {
      body: $("div", {}, q.multi ? $("div", { class: "hint" }, "多选：选对的得分，选错的倒扣") : null, list),
      collect: () => { const v = inputs.filter(x => x.checked).map(x => x.value); return v.length ? v : null; },
      lock: () => inputs.forEach(x => x.disabled = true),
    };
  },

  fill(q) {
    const prompt = $("div", { class: "prompt", html: md(q.prompt, true) });
    const inputs = [];
    prompt.querySelectorAll("[data-blank]").forEach(span => {
      const i = Number(span.dataset.blank);
      const input = $("input", { class: "blank", "aria-label": `第 ${i + 1} 空` });
      input.value = q.previous?.response?.[i] ?? q.draft?.[i] ?? "";
      inputs.push(input);
      span.replaceWith(input);
    });
    if (!inputs.length) { const input = $("input", { class: "blank" }); inputs.push(input); prompt.append(input); }
    return {
      ownsPrompt: true,
      body: prompt,
      collect: () => inputs.every(x => !x.value.trim()) ? null : inputs.map(x => x.value),
      lock: () => inputs.forEach(x => x.disabled = true),
    };
  },

  code(q, ui) {
    // 卡片里是一个小窗编辑器；点「展开」把同一个工作区切成全屏，内容、光标、运行记录都不变。
    // 结果面板两个标签：「终端输出」是 pytest 原样输出（权威），「错误分组」是整理过的阅读辅助。
    const draftKey = `cs-study:draft:${REF}:${q.id}`;
    const tabKey = "cs-study:result-tab";
    const fileName = q.file.split("/").pop();
    const saved = q.previous?.response?.code ?? q.starter ?? "";
    let initial = saved, restoredDraft = false, locked = false, draftTimer = null;
    try {
      const d = localStorage.getItem(draftKey);
      if (d != null && d !== saved && !q.previous) { initial = d; restoredDraft = true; }
    } catch {}

    const editorHost = $("div", { class: "ws-editor" });
    const editor = makeEditor(editorHost, initial, {
      onRun: () => run(), onEscape: () => setExpanded(false),
      onChange: value => {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => { try { localStorage.setItem(draftKey, value); } catch {} }, 400);
      },
    });

    // ---- 拖动分隔条调整编辑器高度 ----
    const split = $("div", { class: "ws-split", title: "拖动调整编辑器高度，双击恢复", role: "separator", "aria-orientation": "horizontal" });
    split.addEventListener("pointerdown", e => {
      e.preventDefault();
      const startY = e.clientY, startH = editorHost.getBoundingClientRect().height;
      const prop = ws.classList.contains("expanded") ? "--ed-h-exp" : "--ed-h";
      split.setPointerCapture(e.pointerId);
      const move = ev => ws.style.setProperty(prop, Math.max(120, Math.min(window.innerHeight - 160, startH + ev.clientY - startY)) + "px");
      const up = () => { split.removeEventListener("pointermove", move); editor.refresh(); };
      split.addEventListener("pointermove", move);
      split.addEventListener("pointerup", up, { once: true });
    });
    split.addEventListener("dblclick", () => { ws.style.removeProperty("--ed-h"); ws.style.removeProperty("--ed-h-exp"); editor.refresh(); });

    // ---- 操作栏 ----
    const status = $("span", { class: "ws-status hint" }, `${q.file} · Ctrl+Enter 运行测试`);
    const draftNote = restoredDraft ? $("span", { class: "ws-draft" }, "已恢复上次没运行的草稿") : null;
    const expandBtn = $("button", { title: "展开成全屏编辑（Esc 收起）", onclick: () => setExpanded(!ws.classList.contains("expanded")) }, "⤢ 展开");
    const runBtn = $("button", { onclick: () => run() }, "运行测试");
    const submitBtn = $("button", { class: "primary", onclick: () => ui.submit(), hidden: ui.exam }, "提交");
    const limited = q.max_runs != null;
    const runsNote = limited ? $("span", { class: "ws-runs" }) : null;
    function showRunsLeft(left) {
      if (!limited) return;
      runsNote.textContent = left > 0 ? `还能运行 ${left}/${q.max_runs} 次` : "运行次数用完了，交卷时按现在的代码判分";
      runsNote.classList.toggle("low", left <= 1);
      if (left <= 0 && !q.previous) lockEditor();
    }
    function lockEditor() {
      locked = true;
      editor.readOnly();
      runBtn.disabled = submitBtn.disabled = true;
      historyList.querySelectorAll("button").forEach(b => b.disabled = true);
    }

    // ---- 结果面板：终端输出（权威） + 错误分组（辅助） ----
    const termPane = $("div", { class: "rt-term", role: "tabpanel" });
    const groupPane = $("div", { class: "rt-groups", role: "tabpanel" });
    const tabTerm = $("button", { class: "rt-tab", role: "tab", onclick: () => showTab("term") }, "终端输出");
    const tabGroups = $("button", { class: "rt-tab", role: "tab", onclick: () => showTab("groups") }, "错误分组");
    const panel = $("div", { class: "rt", hidden: true },
      $("div", { class: "rt-tabs", role: "tablist" }, tabTerm, tabGroups), termPane, groupPane);
    function showTab(name) {
      tabTerm.classList.toggle("on", name === "term"); tabTerm.setAttribute("aria-selected", name === "term");
      tabGroups.classList.toggle("on", name === "groups"); tabGroups.setAttribute("aria-selected", name === "groups");
      termPane.hidden = name !== "term"; groupPane.hidden = name !== "groups";
      try { localStorage.setItem(tabKey, name); } catch {}
    }
    let savedTab = "term";
    try { savedTab = localStorage.getItem(tabKey) || "term"; } catch {}
    showTab(savedTab);

    const historyList = $("ol");
    const historySummary = $("summary", {}, "运行记录");
    const history = $("details", { class: "ws-history", hidden: true }, historySummary, historyList);
    const collapseBtn = $("button", { onclick: () => setExpanded(false) }, "收起 Esc");
    const bar = $("div", { class: "ws-bar" },
      $("b", {}, `代码题 · ${q.file}`), $("span", { class: "tag level" }, `L${q.level} ${q.level_name}`),
      $("span", { class: "spacer" }), $("span", { class: "hint" }, "Ctrl+Enter 运行测试"), collapseBtn);
    const ws = $("div", { class: "ws" },
      bar,
      $("div", { class: "ws-side" }, $("div", { class: "prompt ws-prompt", html: md(q.prompt) }), history),
      $("div", { class: "ws-main" }, editorHost, split,
        $("div", { class: "ws-actions" }, expandBtn, runBtn, submitBtn, runsNote, status, draftNote), panel));

    function setExpanded(on) {
      if (ws.classList.contains("expanded") === on) return;
      ws.classList.toggle("expanded", on);
      document.body.style.overflow = on ? "hidden" : "";
      expandBtn.textContent = on ? "⤡ 收起" : "⤢ 展开";
      editor.refresh();
      editor.focus();
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape" && ws.classList.contains("expanded")) setExpanded(false); });

    const lineLink = n => $("button", { class: "line-link", onclick: () => editor.jump(n) }, `第 ${n} 行`);

    // 终端输出：原样逐行显示，只加颜色；提到学习者代码行号的地方可以点。
    function renderTerminal(output) {
      const esc = fileName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const lineRef = new RegExp(`((?<![\\w.])${esc}:(\\d+)|${esc}", line (\\d+))`, "g");
      termPane.replaceChildren(...String(output || "（没有输出）").split("\n").map(text => {
        let cls = "";
        if (/^E\s/.test(text)) cls = "t-err";
        else if (/^_{3,}.*_{3,}$|^={3,}/.test(text)) cls = "t-rule";
        else if (/\bPASSED\b/.test(text)) cls = "t-pass";
        else if (/\b(FAILED|ERROR)\b/.test(text)) cls = "t-fail";
        else if (/^\s+\^+\s*$/.test(text)) cls = "t-caret";
        const row = $("div", { class: "t-line " + cls });
        let last = 0;
        for (const m of text.matchAll(lineRef)) {
          row.append(text.slice(last, m.index));
          const n = Number(m[2] || m[3]);
          row.append($("a", { href: "#", class: "t-link", onclick: e => { e.preventDefault(); editor.jump(n); } }, m[0]));
          last = m.index + m[0].length;
        }
        row.append(text.slice(last) || "​");
        return row;
      }));
    }

    // 错误分组：同一个错误、同一处代码的测试合在一起，列出每个测试是用什么输入触发的。
    function renderGroups(r) {
      const passed = (r.tests || []).filter(t => t.outcome === "passed").map(t => t.name);
      const groups = r.groups || [];
      const blocks = groups.map((g, i) => $("div", { class: "grp" },
        $("div", { class: "grp-head" },
          $("span", { class: "grp-n" }, `错误 ${i + 1}`),
          g.outcome === "error" ? $("span", { class: "tag" }, "没能运行") : null,
          $("span", { class: "hint" }, `${g.tests.length} 个测试触发`)),
        $("pre", { class: "grp-err" }, (g.tests.length > 1 ? g.summary : g.error) || "（没有错误信息，看终端输出）"),
        g.lines.length ? $("div", { class: "grp-where" }, $("div", { class: "grp-label" }, "出错位置（你的代码）"),
          ...g.lines.map(l => $("div", { class: "grp-row" }, lineLink(l.line), $("code", {}, l.src)))) : null,
        $("div", { class: "grp-label" }, "触发它的测试"),
        ...g.tests.map(t => $("div", { class: "grp-test" },
          $("div", { class: "grp-row" }, $("span", { class: "test-name" }, t.name), t.call ? $("code", {}, t.call.src) : null),
          // 同组里每个测试期望的值不同，逐条保留自己的报错
          g.tests.length > 1 && t.error ? $("pre", { class: "grp-test-err" }, t.error) : null))));
      if (!groups.length && r.total) blocks.push($("div", { class: "grp ok" }, "全部测试通过。"));
      if (passed.length && groups.length) blocks.push($("div", { class: "grp-passed hint" }, `✓ 通过 ${passed.length} 个：${passed.join("、")}`));
      groupPane.replaceChildren(...blocks);
      tabGroups.textContent = groups.length ? `错误分组（${groups.length}）` : "错误分组";
      editor.markLines([...new Set(groups.flatMap(g => g.lines.map(l => l.line)))]);
    }

    function showRun(r, when) {
      const ok = r.total > 0 && r.passed === r.total;
      const nGroups = (r.groups || []).length;
      status.className = "ws-status " + (ok ? "ok" : "bad");
      status.textContent = !r.total ? "没能运行，看终端输出"
        : [`通过 ${r.passed}/${r.total}`, nGroups ? `${nGroups} 种错误` : null,
           r.seconds ? `${r.seconds}s` : null, when].filter(Boolean).join(" · ");
      panel.hidden = false;
      renderTerminal(r.output);
      renderGroups(r);
    }

    async function run() {
      if (locked) return;
      runBtn.disabled = true; runBtn.textContent = "运行中…";
      try {
        const r = await ui.act({ op: "run", code: editor.get() });
        showRun(r, new Date().toTimeString().slice(0, 5));
        try { localStorage.removeItem(draftKey); } catch {}
        draftNote?.remove();
        loadHistory();
        if (r.runs_left != null) showRunsLeft(r.runs_left);
      } catch (e) {
        status.className = "ws-status bad"; status.textContent = e.message;
      }
      runBtn.disabled = locked; runBtn.textContent = "运行测试";
    }

    async function loadHistory() {
      let runs = [];
      try { runs = await api(`/api/runs?ref=${encodeURIComponent(REF)}&qid=${encodeURIComponent(q.id)}`); } catch { return; }
      history.hidden = !runs.length;
      historySummary.textContent = `运行记录（${runs.length} 次）`;
      historyList.replaceChildren(...runs.map((r, i) => {
        const ok = r.total > 0 && r.passed === r.total;
        return $("li", {},
          $("span", { class: "n" }, `#${i + 1}`),
          $("span", {}, r.ts.slice(11, 16)),
          $("span", {}, r.kind === "submit" ? "提交" : "运行"),
          $("span", { class: "res " + (ok ? "ok" : "bad") }, `${r.passed}/${r.total}`),
          $("button", { disabled: locked, onclick: () => {
            if (confirm(`用第 ${i + 1} 次的代码替换编辑器里的内容？`)) { editor.set(r.code); editor.focus(); }
          } }, "载入"));
      }).reverse());
    }
    loadHistory();
    if (limited && !q.previous) showRunsLeft(q.runs_left);

    return {
      body: ws,
      ownsSubmit: true,
      collect: () => ({ code: editor.get() }),
      busy: on => { submitBtn.disabled = on || locked; submitBtn.textContent = on ? "判分中…" : "提交"; },
      lock: lockEditor,
      onResult: (r, initial) => {
        if (r.tests) showRun(r, r.ts ? r.ts.slice(11, 16) : "");
        if (!initial) { setExpanded(false); loadHistory(); try { localStorage.removeItem(draftKey); } catch {} }
      },
    };
  },

  terminal(q, ui) {
    const out = $("div", { class: "out" });
    const input = $("input", { spellcheck: "false", autocomplete: "off", "aria-label": "命令" });
    const history = [];
    let hIdx = 0;
    const print = (text, cls) => { if (text) { out.append($("div", { class: cls || "" }, text)); out.scrollTop = out.scrollHeight; } };
    input.addEventListener("keydown", async e => {
      if (e.key === "ArrowUp" && hIdx > 0) { input.value = history[--hIdx]; e.preventDefault(); }
      if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] ?? ""; e.preventDefault(); }
      if (e.key !== "Enter") return;
      const cmd = input.value.trim();
      input.value = "";
      if (!cmd) return;
      history.push(cmd); hIdx = history.length;
      if (cmd === "clear") { out.innerHTML = ""; return; }
      print("$ " + cmd, "cmd");
      input.disabled = true;
      try { print((await ui.act({ op: "exec", cmd })).output); } catch (err) { print(err.message, "dim"); }
      input.disabled = false; input.focus();
    });
    const term = $("div", { class: "term", onclick: () => input.focus() }, out, $("div", { class: "line" }, $("span", { class: "ps" }, "$"), input));
    const reset = $("button", { onclick: async () => {
      if (!confirm("重置会清掉你在这道题里做的所有操作，确定吗？")) return;
      out.innerHTML = "";
      print((await ui.act({ op: "reset" })).output, "dim");
    } }, "重置场景");
    ui.act({ op: "open" }).then(r => print(r.output, "dim")).catch(e => print(e.message, "dim"));
    if (q.intro) print(q.intro, "dim");
    return {
      body: term,
      extraActions: [reset],
      submitLabel: "提交检查",
      collect: () => ({ history }),
      lock: () => { input.disabled = true; reset.disabled = true; },
    };
  },

  short(q) {
    const area = $("textarea", { rows: 6, placeholder: "用你自己的话写…", "aria-label": "你的回答" });
    area.value = q.previous?.response ?? q.draft ?? "";
    return {
      body: area,
      collect: () => area.value.trim() || null,
      lock: () => area.readOnly = true,
    };
  },
};

// ---------- 页面 ----------
function card(q, idx, lesson) {
  // 渲染函数拿到的 ui：act 走 /api/act；submit 走统一的提交流程（自带提交按钮的题型用它）。
  const exam = lesson.exam;
  const draftKey = `cs-study:exam:${lesson.ref}:${q.id}`;
  if (exam && !q.previous && q.checker !== "code") {
    try { const d = localStorage.getItem(draftKey); if (d != null) q.draft = JSON.parse(d); } catch {}
  }
  const ui = {
    exam,
    act: action => api("/api/act", { lesson: lesson.ref, qid: q.id, action }),
    submit: () => doSubmit(),
  };
  const view = RENDERERS[q.checker](q, ui);
  const resultSlot = $("div");
  const label = view.submitLabel || "提交";
  const submit = $("button", { class: "primary", onclick: () => doSubmit() }, label);

  async function doSubmit() {
    const response = view.collect();
    if (response == null) { alert("还没作答"); return; }
    submit.disabled = true; submit.textContent = "判分中…";
    view.busy?.(true);
    try {
      showResult(await api("/api/submit", { lesson: lesson.ref, qid: q.id, response }));
    } catch (e) {
      resultSlot.replaceChildren($("div", { class: "error" }, e.message));
      submit.disabled = false; submit.textContent = label;
    }
    view.busy?.(false);
  }

  function showResult(r, initial = false) {
    state[q.id] = r;
    view.lock();
    submit.hidden = true;
    try { localStorage.removeItem(draftKey); } catch {}
    resultSlot.replaceChildren(resultBox(r));
    view.onResult?.(r, initial);
    // 首次渲染时卡片还没挂到页面上，进度点和总结由 showLesson 在全部卡片建好后统一画。
    if (!initial) {
      renderDots(lesson); renderSummary(lesson);
      resultSlot.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  const el = $("section", { class: "card", id: "q-" + q.id },
    $("div", { class: "card-head" },
      $("span", { class: "qno" }, `${idx + 1}.`),
      $("span", { class: "tag" }, CHECKER_NAMES[q.checker] || q.checker),
      $("span", { class: "tag level" }, `L${q.level} ${q.level_name}`),
      q.kind === "bug" ? $("span", { class: "tag" }, "找 bug") : null,
      q.kind === "project" ? $("span", { class: "tag" }, "nanoteacher") : null),
    view.ownsPrompt ? null : $("div", { class: "prompt", html: md(q.prompt) }),
    view.body,
    view.ownsSubmit ? null : $("div", { class: "actions" }, ...(view.extraActions || []), exam ? null : submit),
    view.after || null,
    resultSlot);
  if (q.previous) showResult(q.previous, true);
  if (exam && !q.previous && q.checker !== "code") {
    // 交卷前的作答存一份草稿；答没答也用来给底部的「交卷」计数
    const save = () => {
      const v = view.collect();
      drafts[q.id] = v;
      try { v == null ? localStorage.removeItem(draftKey) : localStorage.setItem(draftKey, JSON.stringify(v)); } catch {}
      renderSummary(lesson);
    };
    el.addEventListener("input", save);
    el.addEventListener("change", save);
    drafts[q.id] = view.collect();
  }
  cards[q.id] = { view, showResult };
  return el;
}

function renderDots(lesson) {
  const dots = document.getElementById("dots");
  dots.replaceChildren(...lesson.questions.map((q, i) =>
    $("a", { class: "dot " + (state[q.id]?.result || ""), href: "#q-" + q.id, title: q.id }, String(i + 1))));
}

function renderSummary(lesson) {
  const box = document.getElementById("summary");
  if (!box) return;
  if (lesson.exam && !lesson.questions.every(q => state[q.id])) { renderExamBar(lesson, box); return; }
  const done = lesson.questions.filter(q => state[q.id]);
  if (done.length < lesson.questions.length) {
    box.replaceChildren($("div", { class: "hint" }, `已完成 ${done.length} / ${lesson.questions.length} 题`));
    return;
  }
  const graded = done.map(q => state[q.id]).filter(r => r.result !== "pending");
  const pending = done.length - graded.length;
  const avg = graded.length ? graded.reduce((a, r) => a + r.score, 0) / graded.length : 0;
  box.replaceChildren(
    $("div", { class: "big" }, graded.length ? `${Math.round(avg * 100)}%` : "—"),
    $("div", {}, `已判分 ${graded.length} 题${pending ? `，${pending} 题等导师批改` : ""}`),
    lesson.exam ? $("p", { class: "hint exam-note" }, "简答题由 LLM 按评分标准批改；觉得判得不对，回到对话里说，导师会复核。")
      : $("p", {}, "回到对话，对导师说：", $("code", {}, `批改 ${lesson.ref}`)),
    $("a", { href: `?lesson=${encodeURIComponent(lesson.ref)}&retake=1` }, "整套重做"));
}

// 整卷模式（D-031）：所有题做完一次交；代码题按编辑器里现在的代码判分。
function renderExamBar(lesson, box) {
  const answered = q => q.checker === "code" || q.checker === "terminal" || drafts[q.id] != null;
  const missing = lesson.questions.map((q, i) => answered(q) ? null : i + 1).filter(Boolean);
  const btn = $("button", { class: "primary", onclick: () => submitExam(lesson, btn) }, "交卷");
  box.replaceChildren(
    $("div", {}, `已作答 ${lesson.questions.length - missing.length} / ${lesson.questions.length} 题`),
    $("p", { class: "hint exam-note" }, "单元题整卷一次交：交卷前看不到对错；代码题每题最多运行 5 次测试。交卷后简答题由 LLM 批改，要等几十秒。"),
    btn);
}

async function submitExam(lesson, btn) {
  const responses = {}, missing = [];
  lesson.questions.forEach((q, i) => {
    const v = cards[q.id].view.collect();
    if (v == null && q.checker !== "code" && q.checker !== "terminal") missing.push(i + 1);
    responses[q.id] = v;
  });
  const warn = missing.length ? `第 ${missing.join("、")} 题还没作答，按 0 分算。\n` : "";
  if (!confirm(warn + "交卷后就不能再改了，确定交卷？")) return;
  btn.disabled = true; btn.textContent = "判分中…（简答题在等 LLM 批改）";
  try {
    const r = await api("/api/exam/submit", { lesson: lesson.ref, responses });
    lesson.questions.forEach(q => cards[q.id].showResult(r.questions[q.id], true));
    renderDots(lesson); renderSummary(lesson);
    document.getElementById("summary").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    btn.disabled = false; btn.textContent = "交卷";
    alert("交卷失败：" + e.message);
  }
}

async function showLesson(ref) {
  const lesson = await api(`/api/lesson?ref=${encodeURIComponent(ref)}${RETAKE ? "&retake=1" : ""}`);
  document.title = lesson.title;
  document.getElementById("top").replaceChildren(
    $("h1", {}, lesson.title),
    $("div", { class: "source" }, lesson.source, " · ", $("a", { href: "/" }, "全部课时")),
    $("div", { class: "dots", id: "dots" }));
  const app = document.getElementById("app");
  app.replaceChildren(...lesson.questions.map((q, i) => card(q, i, lesson)),
    $("section", { class: "card summary", id: "summary" }));
  renderDots(lesson);
  renderSummary(lesson);
}

// ---------- 课程页（D-010、D-013 ~ D-017）：讲解在左，练习场终端在右，检查点做对才算学完 ----------
async function showCourse(unitId) {
  let data = await api(`/api/unit?id=${encodeURIComponent(unitId)}`);
  const { plan, settings, sessions } = data;
  const sections = plan.parts.flatMap(p => p.sections.map(s => ({ ...s, part: p.title })));
  const N = sections.length;
  const sessionOf = i => sessions.findIndex(g => g.includes(i));
  const sessionMinutes = g => g.reduce((a, i) => a + sections[i].minutes, 0);
  const hasLab = !!plan.lab;
  let progress = data.progress;
  const isPassed = i => progress.passed.includes(i);
  const isSkipped = i => progress.skipped.includes(i);
  const post = (event, extra = {}) => api("/api/unit/progress", { unit: unitId, event, ...extra });
  const fromHash = Number((location.hash.match(/^#s(\d+)$/) || [])[1]);
  let current = Number.isInteger(fromHash) && fromHash >= 1 && fromHash <= N ? fromHash - 1
    : (sections.findIndex((_, i) => !isPassed(i) && !isSkipped(i)) + 1 || N + 1) - 1;

  // ---- 计时（D-016、D-027）：开着课程页就算在学；5 分钟没操作就暂停，回来时问这段算不算 ----
  const IDLE_MS = 5 * 60000;
  let lastInteract = Date.now(), videoSince = null, pausedAt = null, asking = false;
  const sectionNow = () => current < N ? current : undefined;
  function onInteract() {
    if (pausedAt) { if (!asking) askResume(); return; }
    lastInteract = Date.now();
  }
  if (!showCourse._listening) {
    showCourse._listening = true;
    ["pointerdown", "keydown", "scroll", "mousemove"].forEach(ev =>
      document.addEventListener(ev, () => showCourse._onInteract?.(), { passive: true }));
    document.addEventListener("visibilitychange", () => { if (!document.hidden) showCourse._onInteract?.(); });
  }
  showCourse._onInteract = onInteract;
  clearInterval(showCourse._hb);
  showCourse._hb = setInterval(() => {
    if (videoSince) {
      if (Date.now() - videoSince > 120 * 60000) return setVideo(false);   // 忘了点结束：最多算 2 小时
      return post("activity", { section: sectionNow(), kind: "video" }).catch(() => {});
    }
    if (pausedAt) return;
    if (Date.now() - lastInteract >= IDLE_MS) { pausedAt = lastInteract; return renderBudget(); }
    post("activity", { section: sectionNow(), kind: "page" }).catch(() => {});
  }, 60000);
  function askResume() {
    asking = true;
    const mins = Math.max(1, Math.round((Date.now() - pausedAt) / 60000));
    const answer = counted => {
      mask.remove();
      post("resume", { section: sectionNow(), away_minutes: (Date.now() - pausedAt) / 60000, counted })
        .then(r => { progress = r; renderBudget(); }).catch(() => {});
      pausedAt = null; asking = false; lastInteract = Date.now();
      renderBudget();
    };
    const mask = $("div", { class: "resume-mask", role: "dialog", "aria-modal": "true" },
      $("div", { class: "resume-box" },
        $("h3", {}, `你离开了 ${mins} 分钟`),
        $("p", {}, "这段时间在学吗？比如在看视频、在 Git Bash 里练。"),
        $("div", { class: "actions" },
          $("button", { class: "primary", onclick: () => answer(true) }, "在学，算进学习时间"),
          $("button", { onclick: () => answer(false) }, "没在学，现在继续")),
        $("p", { class: "hint" }, "不回答直接关掉页面：离开的这段不算。")));
    document.body.append(mask);
  }
  const videoBtn = $("button", { class: "video-btn", onclick: () => setVideo(!videoSince) });
  function setVideo(on) {
    videoSince = on ? Date.now() : null;
    if (on) post("activity", { section: current < N ? current : undefined, kind: "video" }).catch(() => {});
    renderVideoBtn();
  }
  function renderVideoBtn() {
    videoBtn.classList.toggle("on", !!videoSince);
    videoBtn.textContent = videoSince ? `● 看视频中 ${Math.floor((Date.now() - videoSince) / 60000)} 分钟 · 看完了` : "▶ 我去看视频了";
    videoBtn.title = videoSince ? "点一下结束" : "切到视频窗口前点一下：看视频的时间也算进学习时间（最多 2 小时）";
  }
  clearInterval(showCourse._vb); showCourse._vb = setInterval(renderVideoBtn, 30000);
  renderVideoBtn();

  // ---- 页面骨架 ----
  document.title = plan.title;
  document.getElementById("app").classList.add("wide");
  const budgetEl = $("div", { class: "budget" });
  fill(document.getElementById("top"),
    $("h1", {}, plan.title),
    $("div", { class: "source" }, `分 ${sessions.length} 次学，每次不超过 ${settings.session_minutes} 分钟 · `,
      $("a", { href: `?kg=${encodeURIComponent(unitId.split("-")[0])}` }, "知识树"), " · ",
      $("a", { href: "?log=1" }, "学习记录"), " · ",
      $("a", { href: "/" }, "全部课程")),
    budgetEl);
  const tocList = $("div");
  const tocSummary = $("summary");
  const toc = $("details", { class: "toc", open: window.innerWidth > 1100 }, tocSummary, tocList);
  const lesson = $("article", { class: "lesson" });
  const term = hasLab ? labTerminal() : null;
  document.getElementById("app").replaceChildren(
    $("div", { class: "course" + (hasLab ? " has-lab" : "") }, toc, lesson, term ? term.el : null));

  function renderBudget() {
    const planned = data.planned_minutes;
    const donePlanned = progress.passed.reduce((a, i) => a + (sections[i]?.minutes || 0), 0);
    const spent = progress.total_spent || 0;
    const over = donePlanned > 0 && spent > donePlanned * 1.4;
    fill(budgetEl,
      $("span", {}, `通过 ${progress.passed.length}/${N} 节`),
      $("div", { class: "budget-bar", title: `已通过的小节计划 ${donePlanned}/${planned} 分钟` }, $("div", { style: `width:${Math.round(100 * donePlanned / planned)}%` })),
      $("span", {}, `计划 ${planned}′（上限 ${settings.unit_budget_minutes}′）· 实际 ${Math.round(spent)}′`),
      over ? $("span", { class: "warn" }, "比计划慢不少：卡住的地方可以先跳过，记下来问导师") : null,
      pausedAt ? $("span", { class: "paused", title: "5 分钟没有操作，计时暂停了。动一下鼠标就会问你这段算不算。" }, "⏸ 已暂停") : null,
      videoBtn);
  }

  function tocMark(i) { return isPassed(i) ? "✓" : isSkipped(i) ? "◐" : "○"; }
  function renderToc() {
    const items = [];
    let idx = 0;
    plan.parts.forEach(p => {
      items.push($("div", { class: "toc-part" }, p.title));
      p.sections.forEach(s => {
        const i = idx++;
        const load = data.load[i];
        items.push($("a", { href: `#s${i + 1}`, class: [i === current ? "on" : "", isPassed(i) ? "done" : "", isSkipped(i) ? "skipped" : ""].join(" "),
          title: isSkipped(i) ? "看过，但没做对检查点" : "", onclick: e => { e.preventDefault(); go(i); } },
          $("span", { class: "mark" }, tocMark(i)),
          $("span", { class: "t" }, s.title),
          $("span", { class: "m" }, `${s.minutes}′`, load && load.new_terms ? $("span", { class: `load-dot l-${load.level}`, title: `新词 ${load.new_terms} 个 · 预计负荷${load.level}` }) : null)));
      });
    });
    items.push($("a", { href: `#end`, class: current === N ? "on" : "", onclick: e => { e.preventDefault(); go(N); } },
      $("span", { class: "mark" }, "★"), $("span", { class: "t" }, "学完 → 练习题")));
    if (plan.later?.length) items.push($("div", { class: "later" }, $("b", {}, "以后再学"), "（不在这次的时间预算里）",
      $("ul", {}, plan.later.map(x => $("li", { title: x.why }, x.title)))));
    if (hasLab) items.push($("div", { class: "later" }, $("b", {}, "练习场"), $("p", {}, plan.lab.story)));
    fill(tocList, ...items);
    tocSummary.textContent = `目录 · 第 ${Math.min(current + 1, N)}/${N} 节`;
  }

  const copyBtn = text => $("button", { onclick: async ev => {
    try { await navigator.clipboard.writeText(text); ev.target.textContent = "已复制"; setTimeout(() => ev.target.textContent = "复制", 1200); } catch {}
  } }, "复制");

  // ---- 一节 ----
  function renderSection() {
    closePopover();
    if (current >= N) return renderFinish();
    const s = sections[current], k = sessionOf(current), i = current;
    const load = data.load[i] || {};
    const spent = progress.spent_minutes[String(i)];
    const blocked = sections.slice(0, i).findIndex((_, j) => !isPassed(j) && !isSkipped(j));
    const explain = $("div", { class: "explain", html: md(s.explain) });
    const terms = s.terms || [];
    markTerms(explain, terms);
    fill(lesson,
      blocked >= 0 ? $("div", { class: "notice" }, `第 ${blocked + 1} 节的检查点还没做对。可以先看这一节，但它可能会用到前面的结果。`,
        $("button", { onclick: () => go(blocked) }, `回第 ${blocked + 1} 节`)) : null,
      $("div", { class: "sec-meta" },
        $("span", {}, s.part), $("span", {}, `第 ${i + 1} / ${N} 节`),
        $("span", {}, `计划 ${s.minutes} 分钟${spent ? `，已用 ${Math.round(spent)}` : ""}`),
        $("span", {}, `第 ${k + 1} 次学习（这次共 ${sessionMinutes(sessions[k])} 分钟）`),
        terms.length ? $("span", { class: `load l-${load.level}`, title: "新词越多越费劲。你标了「早就知道」的词不算新词。" },
          `新词 ${load.new_terms} 个 · 预计负荷${load.level}`) : null),
      $("h2", {}, s.title),
      $("div", { class: "goal" }, $("b", {}, "目标 "), s.goal),
      s.mission ? $("div", { class: "mission" }, $("b", {}, "任务 "), s.mission) : null,
      terms.length ? $("div", { class: "terms" }, $("span", { class: "hint" }, "本节新词（点开看解释）："),
        ...terms.map(t => termChip(t))) : null,
      explain,
      s.try?.length ? $("h3", {}, "动手") : null,
      s.try?.length ? $("ol", { class: "try" }, s.try.map(t => $("li", {},
        $("div", { class: "cmd" }, $("code", {}, t.command),
          term ? $("button", { onclick: () => term.put(t.command), title: "放进右边的终端，按回车运行" }, "放进终端") : null,
          copyBtn(t.command)),
        $("div", { class: "expect", html: "<b>应该看到：</b>" + inlineMd(t.expect) })))) : null,
      s.watch ? $("p", { class: "watch hint" }, "想看原讲解：", s.watch) : null,
      s.checkpoint?.length ? checkpointBlock(s, i) : legacyExtras(s),
      navBar());
    lesson.scrollIntoView({ block: "start" });
  }

  // 旧版课程计划（没有检查点）：常见坑收起来，出事了再看（D-015）
  function legacyExtras(s) {
    return s.pitfalls?.length ? $("details", { class: "deeper" }, $("summary", {}, `遇到问题时看（${s.pitfalls.length} 个常见坑）`),
      ...s.pitfalls.map(p => trapBox(p))) : null;
  }

  function trapBox(p) {
    return $("div", { class: "pit" },
      $("div", { class: "row" }, $("span", { class: "k" }, "你看到"), $("pre", {}, p.symptom)),
      $("div", { class: "row" }, $("span", { class: "k" }, "原因"), $("span", { html: inlineMd(p.cause) })),
      $("div", { class: "row" }, $("span", { class: "k" }, "怎么办"), $("span", { html: inlineMd(p.fix) })));
  }

  // ---- 检查点（D-013） ----
  function checkpointBlock(s, i) {
    const box = $("div", { class: "checkpoints" }, $("h3", {}, `检查点（${s.checkpoint.length} 道，都做对才算学完这一节）`));
    s.checkpoint.forEach((item, idx) => box.append(checkpointItem(item, i, idx)));
    if (isPassed(i)) box.append(ratingRow(i));
    return box;
  }

  function checkpointItem(item, i, idx) {
    const st = progress.checkpoints[String(i)]?.[String(idx)] || {};
    const el = $("div", { class: "cp" + (st.ok ? " ok" : "") });
    const head = $("div", { class: "cp-head" }, $("span", { class: "tag" }, { choice: "选择", fill: "填空", lab: "练习场任务" }[item.type]),
      st.ok ? $("span", { class: "cp-ok" }, `✓ 做对了${st.attempts > 1 ? `（第 ${st.attempts} 次）` : ""}`) : null);
    let collect;
    const body = $("div", { class: "cp-body" });
    if (item.type === "choice") {
      const name = `cp-${i}-${idx}`;
      const inputs = item.options.map((o, n) => $("input", { type: item.multi ? "checkbox" : "radio", name, value: String.fromCharCode(65 + n) }));
      body.append($("div", { class: "prompt", html: md(item.prompt) }),
        $("div", { class: "options" }, item.options.map((o, n) => $("label", { class: "option" }, inputs[n],
          $("span", { class: "letter" }, String.fromCharCode(65 + n)), $("span", { html: inlineMd(o) })))));
      collect = () => { const v = inputs.filter(x => x.checked).map(x => x.value); return v.length ? v : null; };
      [].concat(st.response ?? []).forEach(v => { const x = inputs.find(x => x.value === v); if (x) x.checked = true; });   // 填回上次的答案
    } else if (item.type === "fill") {
      const prompt = $("div", { class: "prompt", html: md(item.prompt, true) });
      const inputs = [...prompt.querySelectorAll("[data-blank]")].map(slot => {
        const inp = $("input", { class: "blank", spellcheck: "false", autocomplete: "off" });
        inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
        slot.replaceWith(inp);
        return inp;
      });
      body.append(prompt);
      if (Array.isArray(st.response)) inputs.forEach((x, n) => { x.value = st.response[n] ?? ""; });                       // 填回上次的答案
      collect = () => inputs.every(x => !x.value.trim()) ? null : inputs.map(x => x.value.trim());
    } else {
      body.append($("div", { class: "prompt", html: md(item.prompt) }),
        $("div", { class: "hint" }, "在右边的终端里做完，再点「检查」。改坏了可以点终端上方的「还原到本节开始」。"));
      collect = () => ({});
    }
    const hintsBox = $("div", { class: "cp-hints" });
    const result = $("div");
    const checkBtn = $("button", { class: "primary", onclick: () => check() }, st.ok ? "再检查一次" : "检查");
    const hintBtn = $("button", { onclick: async () => {
      try {
        const h = await api("/api/unit/hint", { unit: unitId, section: i, idx });
        fill(hintsBox, h.hints.map((t, n) => $("div", { class: "cp-hint" }, $("b", {}, ["方向", "关键概念", "接近答案"][n] || `提示 ${n + 1}`), " ", $("span", { html: inlineMd(t) }))));
        hintBtn.textContent = h.level >= h.total ? "提示已经全部给出" : `再要一级提示（${h.level}/${h.total}）`;
        hintBtn.disabled = h.level >= h.total;
      } catch (e) { alert(e.message); }
    } }, st.hints ? `再要一级提示（${st.hints}/3）` : "要提示");
    async function check() {
      const response = collect();
      if (response == null) { alert("还没作答"); return; }
      checkBtn.disabled = true; checkBtn.textContent = "检查中…";
      try {
        const r = await api("/api/unit/check", { unit: unitId, section: i, idx, response });
        const wasPassed = isPassed(i);
        progress = r.progress;
        fill(result, r.ok
          ? $("div", { class: "result pass" }, $("div", { class: "score" }, "✅ 做对了"),
              r.checks ? $("ul", {}, r.checks.map(c => $("li", {}, "✓ " + c.desc))) : null,
              r.explain ? $("div", { class: "explain", html: "<b>解析：</b>" + md(r.explain) }) : null,
              r.solution?.length ? $("div", {}, $("b", {}, "参考做法"), $("pre", {}, r.solution.join("\n"))) : null)
          : $("div", { class: "result fail" }, $("div", { class: "score" }, `❌ 还不对（第 ${r.attempt} 次）`),
              r.feedback?.length ? $("ul", {}, r.feedback.map(f => $("li", {}, f))) : null,
              r.trap ? $("div", {}, $("div", { class: "hint" }, "你可能踩了这个坑："), trapBox(r.trap)) : null,
              $("div", { class: "hint" }, "改一改再检查；卡住了就要一级提示。")));
        el.classList.toggle("ok", r.ok);
        if (r.ok) head.querySelector(".cp-ok")?.remove(), head.append($("span", { class: "cp-ok" }, "✓ 做对了"));
        renderBudget(); renderToc();
        if (r.section_passed && !wasPassed) {
          // 整节通过：只加上"费不费劲"、换掉底部导航；不重画，答案和解析都留在原处
          lesson.querySelector(".checkpoints")?.append(ratingRow(i));
          lesson.querySelector(".sec-nav")?.replaceWith(navBar());
          lesson.querySelector(".rating")?.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } catch (e) { fill(result, $("div", { class: "error" }, e.message)); }
      checkBtn.disabled = false; checkBtn.textContent = "检查";
    }
    result.className = "cp-result";
    el.append(head, body, hintsBox, $("div", { class: "actions" }, checkBtn, hintBtn), result);
    return el;
  }

  function ratingRow(i) {
    const chosen = progress.ratings[String(i)];
    const labels = ["很轻松", "比较轻松", "有点费劲", "很费劲", "非常费劲"];   // D-029：两头对称
    return $("div", { class: "rating" }, $("span", {}, "这一节费不费劲？"),
      ...labels.map((l, n) => $("button", { class: chosen === n + 1 ? "on" : "", title: l, onclick: async e => {
        // 先亮起来再存；存失败要说出来，不能看起来选上了其实没记下（F-047）
        e.currentTarget.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.currentTarget));
        try {
          progress = await post("load_rating", { section: i, rating: n + 1 });
          lesson.querySelector(".rating")?.replaceWith(ratingRow(i));
        } catch (err) {
          const row = lesson.querySelector(".rating");
          row?.querySelectorAll("button.on").forEach(b => b.classList.remove("on"));
          row?.append($("span", { class: "warn" }, `没存上（${err.message}），再点一次`));
        }
      } }, `${n + 1} ${l}`)),
      $("span", { class: "hint" }, "用来校准「预计负荷」准不准。"));
  }

  function navBar() {
    const i = current, passed = isPassed(i), hasCp = sections[i].checkpoint?.length;
    const next = () => go(i + 1);
    let right;
    if (passed) right = [$("button", { class: "primary", onclick: next }, "下一节 →")];
    else if (!hasCp) right = [$("button", { class: "primary", onclick: async () => {    // 旧版计划：没有检查点，还是自己标记
      progress = await post("done", { section: i }); renderBudget(); next();
    } }, "学完这一节，下一节 →")];
    else right = [$("button", { onclick: () => skip(i) }, isSkipped(i) ? "下一节（这节还没做对）→" : "先跳过这一节 →")];
    return $("div", { class: "sec-nav" },
      i > 0 ? $("button", { onclick: () => go(i - 1) }, "← 上一节") : null,
      $("span", { class: "spacer" }),
      !passed && hasCp ? $("span", { class: "hint" }, "检查点都做对才算学完；跳过的小节在目录里标成 ◐") : null,
      ...right);
  }

  async function skip(i) {
    if (!isSkipped(i)) {
      progress = await post("skip", { section: i });
      const needsLab = hasLab && sections[i].checkpoint?.some(c => c.type === "lab");
      if (needsLab && confirm("后面的节会用到这一节在练习场里的结果。要用参考做法把练习场补齐吗？（推荐）")) {
        const r = await api("/api/unit/lab", { unit: unitId, op: "fill", section: i });
        term?.print(r.output, "dim");
      }
    }
    renderBudget();
    go(i + 1);
  }

  function renderFinish() {
    const left = N - progress.passed.length;
    fill(lesson, $("div", { class: "finish" },
      $("h2", {}, left === 0 ? "这个单元学完了" : `还有 ${left} 节没通过检查点`),
      $("p", {}, "学完之后，你应该能做到下面这些事。练习题就按这些出："),
      $("ol", {}, plan.outcomes.map(o => $("li", {}, o))),
      data.quiz
        ? $("a", { class: "primary-link", href: `?lesson=${encodeURIComponent(data.quiz)}` }, $("button", { class: "primary" }, "开始练习题 →"))
        : $("p", {}, "练习题还没出。回到对话，对导师说：", $("code", {}, `我学完了 ${unitId}，出题`)),
      data.sources?.length ? $("details", { class: "deeper" }, $("summary", {}, "这个单元的出处"),
        $("ul", {}, data.sources.map(x => $("li", {}, $("a", { href: x.url, target: "_blank", rel: "noopener" }, x.title))))) : null,
      plan.later?.length ? $("details", { class: "deeper" }, $("summary", {}, "以后再学（这次没放进来的内容）"),
        $("ul", {}, plan.later.map(x => $("li", {}, $("b", {}, x.title), "：", x.why, " ",
          x.url ? $("a", { href: x.url, target: "_blank", rel: "noopener" }, "链接") : null)))) : null,
      $("div", { class: "sec-nav" }, $("button", { onclick: () => go(N - 1) }, "← 回到最后一节"))));
  }

  // ---- 新词（D-017）：下划线标出，点开看解释，👍 / 👎 ----
  const opened = new Set();
  const pop = $("div", { class: "popover", hidden: true });
  document.body.append(pop);
  document.addEventListener("pointerdown", e => { if (!pop.contains(e.target) && !e.target.closest?.(".nt, .term-chip")) closePopover(); });
  function closePopover() { pop.hidden = true; }

  function termChip(t) {
    const vote = progress.terms[t.id];
    return $("button", { class: "term-chip" + (vote ? " " + vote : ""), onclick: e => openTerm(t, e.currentTarget) }, t.term);
  }

  function markTerms(root, terms) {
    // 每个新词只标第一次出现的地方；英文词要整词匹配，免得把 cat 标进 concatenate 里。
    [...terms].sort((a, b) => b.term.length - a.term.length).forEach(t => {
      const ascii = /^[\x20-\x7e]+$/.test(t.term);
      const re = ascii ? new RegExp(`(^|[^A-Za-z0-9_-])(${t.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?![A-Za-z0-9_-])`) : null;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: n => n.parentElement.closest("pre, .nt") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        let at, len = t.term.length;
        if (ascii) { const m = re.exec(n.data); if (!m) continue; at = m.index + m[1].length; }
        else { at = n.data.indexOf(t.term); if (at < 0) continue; }
        const mid = n.splitText(at);
        mid.splitText(len);
        const span = $("span", { class: "nt", tabindex: "0", role: "button", title: "新词：点开看解释" }, mid.data);
        span.addEventListener("click", () => openTerm(t, span));
        mid.replaceWith(span);
        break;
      }
    });
  }

  function openTerm(t, anchor) {
    if (!opened.has(t.id)) { opened.add(t.id); post("term", { section: current, node: t.id, action: "open" }).catch(() => {}); }
    const vote = progress.terms[t.id];
    const voteBtn = (action, label) => $("button", { class: vote === action ? "on" : "", onclick: async () => {
      progress = await post("term", { section: current, node: t.id, action });
      openTerm(t, anchor);
      lesson.querySelectorAll(".term-chip").forEach(c => { if (c.textContent === t.term) c.className = "term-chip " + action; });
    } }, label);
    fill(pop, $("div", { class: "pop-t" }, t.term), $("div", { html: inlineMd(t.explain) }),
      $("div", { class: "pop-actions" }, voteBtn("unknown", "👍 有用，我确实不懂"), voteBtn("known", "👎 我早就知道")),
      $("div", { class: "hint" }, "你的反馈用来检验「新词预测」准不准；点了「早就知道」的词以后不再算新词。"));
    const r = anchor.getBoundingClientRect();
    pop.hidden = false;
    pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = (r.bottom + scrollY + 6) + "px";
  }

  // 没被标出来、但看不懂的词：选中它，点「这个我不懂」（预测器漏掉的，D-017）
  const missBtn = $("button", { class: "miss-btn", hidden: true }, "这个我不懂");
  document.body.append(missBtn);
  let missText = "";
  lesson.addEventListener("mouseup", () => setTimeout(() => {
    const sel = getSelection();
    const text = sel.toString().trim();
    if (!text || text.length > 40 || current >= N || !lesson.contains(sel.anchorNode)) { missBtn.hidden = true; return; }
    missText = text;
    const r = sel.getRangeAt(0).getBoundingClientRect();
    missBtn.hidden = false;
    missBtn.style.left = (r.left + scrollX) + "px";
    missBtn.style.top = (r.top + scrollY - 34) + "px";
  }, 0));
  document.addEventListener("pointerdown", e => { if (e.target !== missBtn) missBtn.hidden = true; });
  missBtn.addEventListener("click", async () => {
    missBtn.hidden = true;
    try { await post("term_miss", { section: current, text: missText }); toast(`记下了「${missText}」，导师会补上解释`); }
    catch (e) { toast(e.message); }
  });

  // ---- 练习场终端（D-014）：真实的 bash，开在练习场里 ----
  function labTerminal() {
    const out = $("div", { class: "out" });
    const ps = $("span", { class: "ps" }, "$");
    const input = $("input", { spellcheck: "false", autocomplete: "off", "aria-label": "命令", placeholder: "在这里敲命令，回车运行" });
    const where = $("code", { class: "lab-path" });
    let labPosix = "", tabTold = false;
    const hist = [];
    let hIdx = 0;
    const print = (text, cls) => { if (text) { out.append($("div", { class: cls || "" }, text)); out.scrollTop = out.scrollHeight; } };
    const showCwd = cwd => {
      const inside = cwd === labPosix || cwd.startsWith(labPosix + "/");
      ps.textContent = (inside ? "练习场" + cwd.slice(labPosix.length) : cwd) + " $";
      ps.classList.toggle("outside", !inside);
    };
    const act = (op, extra = {}) => api("/api/unit/lab", { unit: unitId, op, section: current < N ? current : undefined, ...extra });
    input.addEventListener("keydown", async e => {
      if (e.key === "Tab") { e.preventDefault(); if (!tabTold) { print("（这里没有 Tab 补全。想练 Tab 补全，就在 Git Bash 里 cd 到上面那个路径试。）", "dim"); tabTold = true; } return; }
      if (e.key === "l" && e.ctrlKey) { e.preventDefault(); out.innerHTML = ""; return; }
      if (e.key === "ArrowUp" && hIdx > 0) { input.value = hist[--hIdx]; e.preventDefault(); }
      if (e.key === "ArrowDown") { hIdx = Math.min(hist.length, hIdx + 1); input.value = hist[hIdx] ?? ""; e.preventDefault(); }
      if (e.key !== "Enter") return;
      const cmd = input.value;
      input.value = "";
      if (cmd.trim()) { hist.push(cmd); hIdx = hist.length; }
      if (cmd.trim() === "clear") { out.innerHTML = ""; return; }
      print(ps.textContent + " " + cmd, "cmd");
      input.disabled = true;
      try {
        const r = await act("run", { cmd });
        print(r.output);
        if (r.rc) print(`（退出码 ${r.rc}）`, "dim");
        if (r.note) print(r.note, "dim");
        if (r.outside) print(`你已经离开练习场（现在在 ${r.cwd}）。这里的文件是真实的，改了没法用「还原」撤销。回练习场：cd "$LAB"`, "warn");
        if (r.cwd) showCwd(r.cwd);
      } catch (err) { print(err.message, "dim"); }
      input.disabled = false; input.focus();
    });
    const restore = $("button", { onclick: async () => {
      if (!confirm(`把练习场还原到第 ${current + 1} 节开始时的样子？这一节里的改动都会丢掉。`)) return;
      try { const r = await act("restore"); print(r.output, "dim"); showCwd(r.cwd); } catch (e) { print(e.message, "dim"); }
    } }, "还原到本节开始");
    const reset = $("button", { onclick: async () => {
      if (!confirm("把练习场重置成单元开始时的样子？所有节的改动都会丢掉。")) return;
      const r = await act("reset"); print(r.output, "dim"); showCwd(r.cwd);
    } }, "重置练习场");
    const el = $("aside", { class: "labterm" },
      $("div", { class: "lab-head" }, $("b", {}, "练习场终端"), $("span", { class: "hint" }, "真实的 bash"), $("span", { class: "spacer" }), restore, reset),
      $("div", { class: "lab-where hint" }, "位置：", where, " · 也可以在 Git Bash 里 cd 过去"),
      $("div", { class: "term", onclick: () => { if (!getSelection().toString()) input.focus(); } }, out, $("div", { class: "line" }, ps, input)));
    act("open").then(r => {
      labPosix = r.lab_posix;
      where.textContent = r.lab_posix;
      showCwd(r.cwd || r.lab_posix);
      if (String(r.bash).startsWith("error")) print(r.bash.slice(7), "warn");
      else print("练习场准备好了。命令都在这个目录里执行，变量和 cd 会保留到下一条命令。", "dim");
    }).catch(e => print(e.message, "warn"));
    return { el, print, put: cmd => { input.value = cmd; input.focus(); } };
  }

  function go(i) {
    current = Math.max(0, Math.min(i, N));
    history.replaceState(null, "", current < N ? `#s${current + 1}` : "#end");
    if (current < N) post("open", { section: current }).catch(() => {});
    renderToc();
    renderSection();
  }

  renderBudget();
  go(current);
}

function toast(text) {
  const t = $("div", { class: "toast" }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
