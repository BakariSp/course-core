const STATE_NAMES = { new: "没学", learning: "在学", weak: "薄弱", mastered: "掌握", stale: "需复习" };
async function showKnowledge(topic) {
  const data = await api(`/api/kg?topic=${encodeURIComponent(topic)}`);
  document.title = `知识树 · ${topic}`;
  document.getElementById("app").classList.add("wide");
  const counts = {};
  data.nodes.forEach(n => counts[n.state] = (counts[n.state] || 0) + 1);
  fill(document.getElementById("top"),
    $("h1", {}, "知识树"),
    $("div", { class: "source" }, "节点的状态由答题、检查点、新词反馈和导师观察算出，不手写 · ",
      ...data.topics.flatMap(t => [t === topic ? $("b", {}, t) : $("a", { href: `?kg=${t}` }, t), " "]),
      "· ", $("a", { href: "/" }, "全部课程")),
    $("div", { class: "kg-legend" }, Object.entries(STATE_NAMES).map(([k, v]) =>
      $("span", { class: `kg-node s-${k}` }, `${v} ${counts[k] || 0}`))));
  const detail = $("aside", { class: "kg-detail" }, $("p", { class: "hint" }, "点一个节点，看它为什么是这个状态、先修是什么。"));
  const canvas = $("div", { class: "kg-canvas" });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("kg-edges");
  const depthMax = Math.max(0, ...data.nodes.map(n => n.depth));
  const cols = [...Array(depthMax + 1)].map((_, d) => $("div", { class: "kg-col" },
    $("div", { class: "kg-col-h" }, d === 0 ? "基础" : `第 ${d} 层`)));
  const els = {};
  data.nodes.forEach(n => {
    const el = $("button", { class: `kg-node s-${n.state} k-${n.kind}`, title: n.desc, onclick: () => showNode(n.id) }, n.title);
    els[n.id] = el;
    cols[n.depth].append(el);
  });
  canvas.append(svg, ...cols);
  document.getElementById("app").replaceChildren(
    data.nodes.length ? $("div", { class: "kg" }, canvas, detail)
      : $("p", { class: "hint" }, "这个学科的知识图还是空的。助教 agent 生成课程时会提议节点，导师审阅后加进来。"));
  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute("width", canvas.scrollWidth); svg.setAttribute("height", canvas.scrollHeight);
    svg.replaceChildren(...data.edges.filter(([a, b]) => els[a] && els[b]).map(([a, b]) => {
      const ra = els[a].getBoundingClientRect(), rb = els[b].getBoundingClientRect();
      const x1 = ra.right - box.left, y1 = ra.top + ra.height / 2 - box.top, x2 = rb.left - box.left, y2 = rb.top + rb.height / 2 - box.top;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", `M${x1},${y1} C${x1 + 30},${y1} ${x2 - 30},${y2} ${x2},${y2}`);
      return p;
    }));
  }
  requestAnimationFrame(drawEdges);
  addEventListener("resize", drawEdges);
  async function showNode(id) {
    const n = await api(`/api/kg/node?id=${encodeURIComponent(id)}`);
    const link = x => $("a", { href: "#", onclick: e => { e.preventDefault(); showNode(x.id); } }, x.title || x.id);
    fill(detail,
      $("div", { class: `kg-node s-${n.state}` }, STATE_NAMES[n.state] || n.state), $("h3", {}, n.title), $("code", {}, n.id),
      $("p", {}, n.desc || "（没有描述）"),
      n.reasons.length ? $("div", {}, $("b", {}, "为什么"), $("ul", {}, n.reasons.map(r => $("li", {}, r)))) : null,
      n.requires.length ? $("div", {}, $("b", {}, "先修："), ...n.requires.flatMap(r => [link(r), `（${STATE_NAMES[r.state] || r.state}） `])) : null,
      n.required_by.length ? $("div", {}, $("b", {}, "后续："), ...n.required_by.flatMap(r => [link(r), " "])) : null,
      n.evidence.length ? $("details", { open: true }, $("summary", {}, `证据（${n.evidence.length} 条）`),
        $("ul", { class: "kg-ev" }, n.evidence.map(e => $("li", {}, $("span", { class: "hint" }, e.ts.replace("T", " "), " "),
          e.sign > 0 ? "＋" : e.sign < 0 ? "－" : "·", " ", e.note)))) : null);
    Object.values(els).forEach(el => el.classList.remove("sel"));
    els[id]?.classList.add("sel");
  }
}

// ---------- 学习记录（D-027）：每次学了多久、做成了什么，全是证据的投影 ----------
async function showLog() {
  const data = await api("/api/log");
  document.title = "学习记录";
  const fmt = m => m >= 60 ? `${Math.floor(m / 60)} 小时 ${Math.round(m % 60)} 分钟` : `${Math.round(m)} 分钟`;
  const today = new Date(), iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const weekAgo = iso(new Date(today.getTime() - 6 * 86400000));
  const week = data.days.filter(d => d.date >= weekAgo).reduce((a, d) => a + d.minutes, 0);
  const todayMin = data.days.find(d => d.date === iso(today))?.minutes || 0;
  fill(document.getElementById("top"),
    $("h1", {}, "学习记录"),
    $("div", { class: "source" }, "从你在这里的每次操作算出来；5 分钟没操作会暂停，回来时你说了算 · ",
      $("a", { href: "/" }, "全部课程")),
    $("div", { class: "log-sum" },
      $("span", {}, "今天 ", $("b", {}, fmt(todayMin))),
      $("span", {}, "近 7 天 ", $("b", {}, fmt(week))),
      $("span", {}, "累计 ", $("b", {}, fmt(data.total_minutes)))));
  const session = s => {
    const did = [
      s.passed?.length ? $("li", {}, "通过：", s.passed.join("、")) : null,
      s.terms?.length ? $("li", {}, "学会的新词：", s.terms.join("、")) : null,

      s.questions?.length ? $("li", {}, `练习题 ${s.questions.length} 道：`,
        s.questions.map(q => `${q.id.split("#")[1]} ${q.score == null ? "待批改" : Math.round(q.score * 100) + "%"}`).join("、")) : null,
    ].filter(Boolean);
    return $("div", { class: "log-s" },
      $("div", {}, $("span", { class: "when" }, `${s.start.slice(11)}–${s.end.slice(11)}`), " · ", fmt(s.minutes), s.manual ? "（补录）" : ""),
      $("div", { class: "what" }, Object.entries(s.by_label).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmt(v)}`).join("、")),
      did.length ? $("ul", {}, did) : null);
  };
  document.getElementById("app").replaceChildren(data.days.length
    ? $("div", {}, data.days.map(d => $("section", { class: "log-day" },
        $("h3", {}, $("span", {}, d.date), $("span", { class: "hint" }, `合计 ${fmt(d.minutes)}`)),
        d.sessions.slice().reverse().map(session))))
    : $("p", { class: "hint" }, "还没有学习记录。打开一个课程页开始学吧。"));
}

          $("td", {}, r.judge?.avg ?? "—", r.judge?.top_issue ? $("div", { class: "hint" }, r.judge.top_issue) : null),
          $("td", {}, verdict(r.review), r.review?.issues?.length ? $("ul", { class: "pn-issues hint" },
            r.review.issues.map(i => $("li", {}, `[${LAYER[i.layer] || i.layer}] ${i.what}`))) : null),
          $("td", {}, verdict(r.verify), ...(r.verify?.problems || []).map(x => $("div", { class: "hint" }, x))),
          $("td", { class: "wide-only hint" }, `${r.minutes} 分钟 · $${r.cost_usd}`)))) : $("p", { class: "hint" }, "还没有备课记录。"),
      $("h3", {}, "agent 备课时读到的输入"),
      $("p", { class: "hint" }, ctx.last_run
        ? (ctx.changed_since_last_run.length ? `和上次运行（${ctx.last_run}）比，这几块变了（橙框）：${ctx.changed_since_last_run.join("、")}` : `和上次运行（${ctx.last_run}）时一样。`)
        : "这是下一次生成时 agent 会读到的内容。"),
      ctx.blocks.map(b => $("details", { class: "pn-block" + (ctx.changed_since_last_run.includes(b.key) ? " changed" : "") },
        $("summary", {}, $("b", {}, b.title), " ", $("span", { class: "hint" }, `来自 ${b.source}${b.editable ? "" : "（自动算，不能手改）"}`)),
        $("div", { class: "hint" }, "怎么改：", b.how),
        $("pre", {}, show(b.value)))),
      $("details", { class: "pn-block" }, $("summary", {}, $("b", {}, "拼好的完整简报"), " ", $("span", { class: "hint" }, "上面各块填进任务模板之后，agent 实际读到的全文")),
        $("pre", {}, ctx.brief)),
      ctx.prompts.map(pr => $("details", { class: "pn-block" }, $("summary", {}, $("b", {}, pr.title), " ", $("span", { class: "hint" }, pr.source)),
        $("pre", {}, pr.text))));
  }

  await load();
}

const UNIT = params.get("unit");
const KG = params.get("kg");
(UNIT ? showCourse(UNIT) : KG ? showKnowledge(KG) : REF ? showLesson(REF) : params.has("log") ? showLog()
  : params.has("panel") ? showPanel() : showIndex()).catch(e => {
  document.getElementById("app").replaceChildren($("p", { class: "error" }, "加载失败：" + e.message));
});
</script>
</body>
</html>
