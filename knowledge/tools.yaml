# 知识图（D-020、D-047）：节点 + 先修关系。状态不写在这里，由证据算出（study.py kg）。
# requires 每条：id、kind（required 必须先会 / helpful 先会更好）、by（谁说的：运行 id 或 learner）。
# misconceptions：常见误解 id → desc（说明）、by（谁提的）；题目的得分点用它说明错在哪（D-056）。
topic: tools
nodes:
  tools.shell.roles:
    title: 终端、shell、命令的分工
    desc: 终端负责显示和接收按键；shell 读你敲的一行字、改写后启动程序；命令是被启动的那个程序。
    kind: concept
  tools.shell.expansion:
    title: shell 先改写命令行再启动程序
    desc: 变量、通配符、引号都由 shell 在启动程序之前处理，程序收到的是改写后的参数。
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: tutor
  tools.shell.glob:
    title: 通配符（glob）
    desc: '*.txt 这类写法由 shell 展开成匹配的文件名列表，再交给命令。'
    kind: concept
    requires:
    - id: tools.shell.expansion
      kind: required
      by: tutor
  tools.shell.quoting:
    title: 引号改变谁来解释
    desc: 单引号里的内容 shell 原样交给程序；双引号里 shell 仍会展开变量。
    kind: concept
    requires:
    - id: tools.shell.expansion
      kind: required
      by: tutor
  tools.cmd.sed:
    title: sed
    desc: 按规则逐行改写文本的命令，最常用 s/旧/新/g 替换。
    kind: term
    requires:
    - id: tools.shell.quoting
      kind: required
      by: tutor
  tools.shell.options:
    title: 选项常常切换输出模式
    desc: -l、-c 这类选项不只是修饰，常常让命令改成输出另一种东西（如 grep -l 只打印文件名）。
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: tutor
  tools.shell.metachars:
    title: 语法字符和展开字符
    desc: ; | > 是 shell 用来切分、连接命令的语法字符；* $ ~ 是 shell 要展开的字符。两类都要加引号或反斜杠才能原样交给程序。
    kind: concept
    requires:
    - id: tools.shell.expansion
      kind: required
      by: tutor
  tools.cmd.find:
    title: find
    desc: 按名字、类型等条件在目录树里找文件；-exec 对每个结果执行一条命令。
    kind: term
    requires:
    - id: tools.shell.glob
      kind: required
      by: tutor
    - id: tools.shell.metachars
      kind: required
      by: tutor
  tools.cmd.grep:
    title: grep
    desc: 在文本里找包含某个模式的行。
    kind: term
    requires:
    - id: tools.shell.options
      kind: required
      by: tutor
  tools.shell.cwd:
    title: 当前工作目录（pwd / cd）
    desc: shell 记着“我现在站在哪个目录”：pwd 打印它，cd 改变它，提示符里显示它，相对路径从它开始算
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.paths:
    title: 路径：绝对、相对、~ 与 . ..
    desc: 以 / 开头是绝对路径、否则是相对路径；~ 是家目录，. 是当前目录，.. 是上一级目录
    kind: concept
    requires:
    - id: tools.shell.cwd
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.ls:
    title: ls
    desc: 列出目录里的名字（末尾带 / 的是目录）
    kind: term
    requires:
    - id: tools.shell.cwd
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.stdstreams:
    title: 标准输入与标准输出
    desc: 程序默认的打印通道和读入通道，默认连着终端；重定向和管道都是在改这两条通道接到了哪里
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.redirection:
    title: 重定向（> / >> / <）
    desc: shell 在启动程序之前打开文件，把程序的标准输出或标准输入接到它上面；> 清空重写，>> 追加
    kind: concept
    requires:
    - id: tools.shell.stdstreams
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.cat:
    title: cat
    desc: 把文件内容原样打到标准输出；也常用来把标准输入的内容原样转出去
    kind: term
    requires:
    - id: tools.shell.stdstreams
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.pipe:
    title: 管道（|）
    desc: 把左边程序的标准输出接到右边程序的标准输入；没给文件参数的程序就从标准输入读
    kind: concept
    requires:
    - id: tools.shell.stdstreams
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.head:
    title: head
    desc: 打印文件的头几行（head -n 5 文件）
    kind: term
    requires:
    - id: tools.shell.stdstreams
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.tail:
    title: tail
    desc: 打印文件的末尾几行（tail -n 5 文件），看最新的事故最常用
    kind: term
    requires:
    - id: tools.shell.stdstreams
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.trace:
    title: set：用 -x 看到 shell 改写后的命令
    desc: 打开 shell 的“直播”，在每条命令执行前打印它实际要执行的内容（展开之后的样子）；set +x 关掉
    kind: skill
    requires:
    - id: tools.shell.expansion
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.echo:
    title: echo
    desc: 把参数打到标准输出；观察“shell 到底交给了程序什么”最好用的工具
    kind: term
    requires:
    - id: tools.shell.expansion
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.exitcode:
    title: 退出码与 $?
    desc: 程序用 0–255 的数字报告成败，0 是成功；$? 是上一条命令的退出码，会被下一条命令覆盖
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.test:
    title: test 与 [ ]
    desc: 检查一个条件的裁判：只把答案放进退出码、不打印任何东西；[ … ] 是它的另一种写法
    kind: term
    requires:
    - id: tools.shell.exitcode
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.conditional:
    title: if 判断语句
    desc: bash 的判断语句：如果条件成立（退出码 0）就走 then，否则走 else
    kind: concept
    requires:
    - id: tools.cmd.test
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.shell.help:
    title: 查命令文档：--help 与 help
    desc: 一般程序用 命令 --help 看用法；bash 内建命令用 help 名字（Git Bash 没有 man）
    kind: skill
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-135626-tools-01-shell
  tools.cmd.git:
    title: git
    desc: 版本控制的程序，用法是 git <子命令> <参数>。
    kind: term
  tools.git.repo:
    title: 仓库（repository）
    desc: 一个普通目录 + 旁边的 .git 目录；这个目录的全部历史都存在 .git 里。
    kind: concept
    requires:
    - id: tools.cmd.git
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.init:
    title: git init
    desc: 把当前目录变成仓库：只多出一个 .git（-b main 顺便把主线名字定成 main），已有文件不动。
    kind: term
    requires:
    - id: tools.git.repo
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.shell.cwd
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.status:
    title: git status
    desc: 不修改任何东西，只报告：哪些改动在暂存区、哪些没暂存、哪些文件还没被记录（untracked）。
    kind: term
    requires:
    - id: tools.git.repo
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.python:
    title: python
    desc: 启动 Python 程序：python check.py 让 Python 执行这个文件；脚本用退出码报告成败。
    kind: term
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.shell.exitcode
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.snapshot:
    title: 快照与提交（commit）
    desc: Git 记录历史的方式：一次记下当时所有被跟踪文件的完整内容，一份快照就是一次提交。
    kind: concept
    requires:
    - id: tools.git.repo
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.staging:
    title: 暂存区（staging area）
    desc: 工作区和下一次提交之间的一块中间地带，一份“下次要装什么”的清单。
    kind: concept
    requires:
    - id: tools.git.snapshot
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.add:
    title: git add
    desc: 把指定路径的当前内容放进暂存区（可以一次给多个路径）。
    kind: term
    requires:
    - id: tools.git.staging
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.commit:
    title: git commit
    desc: 把暂存区里的内容做成一次提交（快照）；-m 后面跟这次提交的消息。
    kind: term
    requires:
    - id: tools.git.staging
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.reset:
    title: git reset <路径>
    desc: 把路径从暂存区拿回工作区：不进这次提交了，但改动还在。
    kind: term
    requires:
    - id: tools.git.staging
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.log:
    title: git log
    desc: 打印历史（谁、什么时候、为什么）；--oneline 一行一条，--graph --all 画出分叉。
    kind: term
    requires:
    - id: tools.git.snapshot
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.revision:
    title: 提交哈希（指名一个提交）
    desc: 按内容算出来的十六进制指纹，可以只用前几位来指名某一个提交。
    kind: concept
    requires:
    - id: tools.git.snapshot
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.head:
    title: HEAD
    desc: Git 里表示“我现在站在哪个提交上”的特殊名字；HEAD~1 是往前一次提交。
    kind: concept
    requires:
    - id: tools.git.revision
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.show:
    title: git show
    desc: 打印某一次提交的消息和它改了什么（补丁）。
    kind: term
    requires:
    - id: tools.cmd.git.log
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.git.revision
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.diff:
    title: git diff
    desc: 比较文件内容；不带参数时只显示还没进暂存区的改动（全都要看用 git diff HEAD）。
    kind: term
    requires:
    - id: tools.git.staging
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.branch:
    title: 分支（branch）
    desc: 指向某个提交的一个可移动的名字；历史的分叉靠它，主线通常叫 main。
    kind: concept
    requires:
    - id: tools.git.head
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.branch:
    title: git branch
    desc: 列出所有分支（带 * 的是当前所在）；git branch <名字> 创建新分支但不切过去。
    kind: term
    requires:
    - id: tools.git.branch
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.switch:
    title: git switch
    desc: 切到另一个分支：目录里的文件会变成那个分支的样子。
    kind: term
    requires:
    - id: tools.git.branch
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.merge:
    title: git merge
    desc: 把指定分支的改动合进当前所在的分支；两边改了同一行时会停下来说有冲突。
    kind: term
    requires:
    - id: tools.git.branch
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.conflict:
    title: 合并冲突与冲突标记
    desc: <<<<<<<、=======、>>>>>>> 三行把两边的版本围起来，等你自己决定留哪个；删掉标记并 git add 才算解决。
    kind: concept
    requires:
    - id: tools.cmd.git.merge
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.blame:
    title: git blame
    desc: 逐行打印文件：每一行最后一次是被哪个提交改的（哈希）、谁改的、什么时候。
    kind: term
    requires:
    - id: tools.cmd.git.log
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.git.revision
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.log-s:
    title: git log -S
    desc: 按内容找历史：找出让某段文字出现或消失的那些提交（用 -- 限定路径）。
    kind: term
    requires:
    - id: tools.cmd.git.log
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.bisect:
    title: git bisect
    desc: 在已知的好提交和坏提交之间二分查找：start 开始，bad / good 报告每次结果，reset 回到原处。
    kind: term
    requires:
    - id: tools.git.revision
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.shell.exitcode
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.bisect-run:
    title: git bisect run
    desc: 让 Git 每换一个版本就自动跑一条命令，按退出码（0 好、非 0 坏）判断，直到找出第一个坏提交。
    kind: term
    requires:
    - id: tools.cmd.git.bisect
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.shell.exitcode
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.cmd.git.restore:
    title: git restore
    desc: 把文件恢复成上次提交的样子，未提交的改动会丢掉。
    kind: term
    requires:
    - id: tools.git.snapshot
      kind: required
      by: 20260926-220228-tools-02-git-r2
    - id: tools.cmd.git.status
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.git.gitignore:
    title: .gitignore
    desc: 仓库根目录里的忽略清单，一行一个模式；只管还没被跟踪的文件，也不会删掉你的文件。
    kind: concept
    requires:
    - id: tools.cmd.git.status
      kind: required
      by: 20260926-220228-tools-02-git-r2
  tools.debug.reproduce:
    title: 复现（reproduce）
    desc: 用固定的输入和步骤让故障稳定重现出来：能重现，才能反复试、才能确认自己真的修好了。
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.logging:
    title: 日志（logging）
    desc: 程序在运行时把自己做了什么事写下来的记录（写到文件或终端）：不用改代码、不用盯着看，事后就能回看当时发生了什么。
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.traceback:
    title: 报错信息（traceback）
    desc: 程序崩掉时打印的那几行：最下面一行是错误类型和消息，往上每两行是调用它的那一层——文件名、行号、那行代码。
    kind: concept
    requires:
    - id: tools.cmd.python
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.callstack:
    title: 调用栈（call stack）
    desc: 程序此刻走到了哪个位置、它是被谁调进来的：A 调用 B、B 调用 C，串起来就是调用栈；报错信息就是把它打印出来的样子。
    kind: concept
    requires:
    - id: tools.debug.traceback
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.print:
    title: 打印调试（print debugging）
    desc: 在可疑的位置插一条打印语句，把中间值打到屏幕上，用实际输出代替猜测；知道要打印什么、改一次代码很便宜的时候最顺手。
    kind: skill
    requires:
    - id: tools.cmd.python
      kind: required
      by: 20260926-231525-tools-03-debug-r2
    - id: tools.debug.traceback
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.debugger:
    title: 调试器（debugger）
    desc: 能让你在程序运行中间停下来、一步步走、随时查看变量的程序；当你不确定该打印什么，或改一次代码要重启很久时用它。
    kind: concept
    requires:
    - id: tools.debug.print
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.breakpoint:
    title: 断点（breakpoint）
    desc: 告诉调试器在哪个文件的哪一行停下来；也可以加条件，只在满足条件时停。
    kind: concept
    requires:
    - id: tools.debug.debugger
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.cmd.pdb:
    title: python -m pdb（Python 调试器）
    desc: Python 自带的调试器；python -m pdb 脚本.py 用它启动脚本，然后用 b / p / n / c / q 这些单字母命令控制程序。
    kind: term
    requires:
    - id: tools.debug.breakpoint
      kind: required
      by: 20260926-231525-tools-03-debug-r2
    - id: tools.cmd.python
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.loglevel:
    title: 日志级别（log level）
    desc: 每条日志带的严重程度标签（DEBUG / INFO / WARN / ERROR），用来决定哪些日志值得写下来、哪些应该被过滤掉。
    kind: concept
    requires:
    - id: tools.debug.logging
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.timing:
    title: 计时（timing：real / user / sys）
    desc: 量一个程序花了多久：real 是从头到尾经过的时间（包含等待），user 和 sys 才是 CPU 真正替它干活的时间。
    kind: concept
    requires:
    - id: tools.shell.roles
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.cmd.time:
    title: time（量一条命令花了多久）
    desc: bash 里可以直接写在命令前面的 time：time python app.py 会打印 real / user / sys 三个数。
    kind: term
    requires:
    - id: tools.debug.timing
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.profiler:
    title: 性能分析器（profiler）
    desc: 记录程序里每个函数被调用多少次、各花了多少时间的工具，用来找热点；分采样式（定期取样，开销小）和追踪式（每次调用都记）。
    kind: concept
    requires:
    - id: tools.debug.timing
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.debug.hotspot:
    title: 热点（hot spot）
    desc: 程序里最花时间的那一小部分代码；要优化之前先用 profiler 把它找出来，别凭感觉猜。
    kind: concept
    requires:
    - id: tools.debug.profiler
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.cmd.python.cprofile:
    title: python -m cProfile（Python 的追踪式 profiler）
    desc: Python 自带；python -m cProfile -s tottime 脚本.py 会按「函数自己花的时间」排序打印统计。
    kind: term
    requires:
    - id: tools.debug.profiler
      kind: required
      by: 20260926-231525-tools-03-debug-r2
    - id: tools.cmd.python
      kind: required
      by: 20260926-231525-tools-03-debug-r2
  tools.cmd.nl:
    title: nl
    desc: 打印文件内容并在每行前面加上行号（nl -ba 连空行也编号），用来把内容和行号对起来。
    kind: term
    requires:
    - id: tools.cmd.cat
      kind: required
      by: tutor
  tools.python.argv:
    title: sys.argv
    desc: Python 程序里装着命令行参数的列表：第 0 个是脚本名，第 1 个是跟在命令行上的第一个参数。
    kind: term
    requires:
    - id: tools.cmd.python
      kind: required
      by: tutor
  tools.debug.breakpoint-call:
    title: breakpoint()（在代码里设断点）
    desc: Python 的内建函数：在源码里调用它，程序跑到这一行自动停下并进入 pdb。
    kind: term
    requires:
    - id: tools.cmd.pdb
      kind: required
      by: tutor
    - id: tools.debug.breakpoint
      kind: required
      by: tutor
  tools.debug.post-mortem:
    title: 在崩溃现场检查（post-mortem）
    desc: 程序崩溃后不重跑，就停在它出事的那一刻查看当时的变量和调用栈。
    kind: concept
    requires:
    - id: tools.debug.debugger
      kind: required
      by: tutor
    - id: tools.debug.traceback
      kind: required
      by: tutor
  tools.debug.structured-logging:
    title: 结构化日志
    desc: 日志除了一段文本还带一组有名字的字段（指标、JSON 对象），事后可以用程序按字段过滤和统计。
    kind: concept
    requires:
    - id: tools.debug.logging
      kind: required
      by: tutor
  tools.debug.profiler-types:
    title: 追踪式 / 采样式 profiler
    desc: 追踪式 profiler 记录每一次函数调用，采样式 profiler 每隔一小段时间探测程序当时在哪个栈上。
    kind: concept
    requires:
    - id: tools.debug.profiler
      kind: required
      by: tutor
  tools.debug.profile-stats:
    title: ncalls / tottime / cumtime
    desc: profiler 输出里的三列：调用次数、函数自己花的时间、连同子函数在内花的时间。
    kind: concept
    requires:
    - id: tools.debug.profiler
      kind: required
      by: tutor
  tools.debug.benchmarking:
    title: 基准测试
    desc: 把同一件事的几种做法各跑很多次、比较耗时，用均值、标准差这类统计量说明差距，而不是只看一次运行。
    kind: concept
    requires:
    - id: tools.debug.timing
      kind: required
      by: tutor
  tools.debug.ai-debug:
    title: 用 LLM 辅助调试
    desc: 把报错信息、stack trace、工具输出交给大语言模型，让它解释发生了什么并建议下一步，再用真实工具验证。
    kind: skill
    requires:
    - id: tools.debug.traceback
      kind: required
      by: tutor
  tools.agent.llm:
    title: large language model（LLM）
    desc: 一个概率模型：给它一段输入文本，它给出输出文本的概率分布，用模型就是从分布里采样一条输出。
    kind: concept
  tools.agent.prompt:
    title: prompt（提示）
    desc: 喂给语言模型的那段输入文本；对 coding agent 来说就是你用自然语言写下的任务描述。
    kind: concept
  tools.agent.multi-turn:
    title: multi-turn interaction（多轮对话）
    desc: 对话式 AI 的工作方式：每发一条新消息，程序把整段对话历史重新当作 prompt 喂给模型。
    kind: concept
    requires:
    - id: tools.agent.llm
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.context-window:
    title: context window
    desc: 一个模型单次能接收的输入加输出文本的长度上限，超出这个长度的内容这一轮看不到。
    kind: concept
    requires:
    - id: tools.agent.llm
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.harness:
    title: agent harness
    desc: 包在语言模型外面的那层程序：反复调用模型采样输出，执行模型请求的工具调用，把工具输出拼回下一次输入。
    kind: concept
    requires:
    - id: tools.agent.llm
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.shell.roles
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.tool-call:
    title: tool call
    desc: 语言模型的一种输出：不是给用户看的文字，而是一个「请执行这个工具 / 这条命令」的请求，由 harness 解释并真正执行。
    kind: concept
    requires:
    - id: tools.agent.harness
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.permissions:
    title: 确认工具调用（permission）
    desc: agent harness 的一层设置：对可能改动你机器状态的工具调用，默认先停下来问你同不同意。
    kind: concept
    requires:
    - id: tools.agent.tool-call
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.git.snapshot
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.coding-agent:
    title: coding agent
    desc: 一个程序：把语言模型和能调用工具（读写文件、执行命令）的 harness 合在一起，所以它除了对话还能在你的机器上动手。
    kind: concept
    requires:
    - id: tools.agent.harness
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.agent.tool-call
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.feedback-loop:
    title: feedback loop（反馈回路）
    desc: 让 agent 自己能跑出「通过 / 不通过」结论的检查：它看输出、再改、再跑，自己迭代。
    kind: concept
    requires:
    - id: tools.agent.tool-call
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.shell.exitcode
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.debug.reproduce
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.tdd:
    title: test-driven development（配合 agent）
    desc: 先有测试（你写或让 agent 写初稿、你审），再让 agent 改实现直到测试通过，测试从此留作回归测试。
    kind: skill
    requires:
    - id: tools.agent.feedback-loop
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.fix-errors:
    title: 用 agent 修报错
    desc: 把编译器、类型检查器或测试报出来的问题交给 agent，并告诉它哪条命令能复现，让它自己跑到检查通过。
    kind: concept
    requires:
    - id: tools.agent.feedback-loop
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.git-workflow:
    title: 让 agent 的改动落在 Git 里
    desc: 和 coding agent 配合的常规做法：项目放在 Git 仓库里、按仓库习惯提交，这样它改了什么随时能看、能回退。
    kind: concept
    requires:
    - id: tools.agent.coding-agent
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.diff
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.status
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.log
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.git.snapshot
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.git.staging
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.review-output:
    title: 审查 AI 的输出
    desc: 把 agent 给的代码当成别人的提交来核对（而不是当成正确答案），重点看正确性上的 bug。
    kind: skill
    requires:
    - id: tools.agent.coding-agent
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.diff
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.debugging-spiral:
    title: debugging spiral（调试螺旋）
    desc: coding agent 的一种失败模式：反复「改代码 → 跑测试 → 失败」停不下来，代码越改越糟。
    kind: concept
    requires:
    - id: tools.agent.feedback-loop
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.context-management:
    title: context management（上下文管理）
    desc: 有意地决定每次喂给模型的上下文里放什么、不放什么，因为窗口有限、而且输入越多模型表现越差。
    kind: concept
    requires:
    - id: tools.agent.context-window
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.agent.multi-turn
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.context-clear:
    title: 清空上下文窗口（clear）
    desc: 丢掉当前全部对话历史，从新的一轮空上下文开始（等于开一个新会话）。
    kind: skill
    requires:
    - id: tools.agent.context-management
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.compaction:
    title: compaction（上下文压缩）
    desc: 历史太长时自动或按你要求调用一次模型，把前段历史总结成摘要替换掉那部分历史。
    kind: concept
    requires:
    - id: tools.agent.context-management
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.agents-md:
    title: AGENTS.md
    desc: 放在仓库里的一份「给 coding agent 看的 README」：agent 启动时把它的整份内容预填进上下文。
    kind: term
    requires:
    - id: tools.agent.context-management
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.git.repo
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.skills:
    title: skills
    desc: 按需加载的说明单元：启动时只给 agent 一份「有哪些技能 + 各自一句话描述」的清单，需要时再打开读进上下文。
    kind: term
    requires:
    - id: tools.agent.context-management
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.agent.agents-md
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.code-review:
    title: 用 agent 做代码审查
    desc: 让另一个 agent 读你的改动、指出其中问题；一句「review 我还没提交的改动」通常就够。
    kind: concept
    requires:
    - id: tools.agent.coding-agent
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.diff
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.codebase-understanding:
    title: 用 agent 读懂代码库
    desc: 把 agent 当助手向它提问：某个功能怎么实现的、要改哪些文件，适合刚接手一个陌生仓库的时候。
    kind: concept
    requires:
    - id: tools.agent.coding-agent
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.find
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
    - id: tools.cmd.git.blame
      kind: helpful
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.privacy:
    title: 隐私（privacy）
    desc: 大多数 AI 编码工具在默认配置下会把你大量数据（代码内容、你和工具的交互）发到云端服务商那里。
    kind: concept
    requires:
    - id: tools.agent.coding-agent
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.agent.cost:
    title: 用量与花费（cost）
    desc: coding agent 用的是云端模型推理、按用量收费：更大的模型更强也更贵，更小更快的模型更便宜。
    kind: concept
    requires:
    - id: tools.agent.llm
      kind: required
      by: 20260928-203106-tools-05-agentic-r1
  tools.quality.format:
    title: 代码自动格式化器
    desc: 读入源文件、按固定规则重写表面写法（引号、运算符两侧空格、import 排序、过长行）的程序；有只报告和直接改文件两种用法。
    kind: term
  tools.quality.format-config:
    title: 格式化器的可配置性
    desc: 通过配置文件挑选风格；配置文件要提交进版本控制；有些工具刻意少配置以减少 bikeshedding。
    kind: concept
    requires:
    - id: tools.quality.format
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.lang-specific-tools:
    title: 工具与语言绑定，概念通用
    desc: 质量工具（格式化器、linter、测试库）大多是语言专属的，但格式化、lint、测试、CI 这些概念几乎通用。
    kind: concept
  tools.quality.lint:
    title: linter / 静态分析
    desc: 读你的代码但不运行它，在源码上做静态分析、找出反模式和有潜在问题的写法。
    kind: term
  tools.quality.lint-rule:
    title: linter 规则与预设
    desc: linter 内置的一条条检查项，按预设启用；规则会误报，可以按文件或按行关掉。
    kind: concept
    requires:
    - id: tools.quality.lint
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.ruff:
    title: Ruff（Python 的 linter 兼格式化器）
    desc: 讲义里 Python 项目的例子工具，自带 800 多条规则、每条规则有文档，一条命令就能检查或改写。
    kind: term
    requires:
    - id: tools.quality.lint
      kind: required
      by: 20260928-203521-tools-04-quality-r1
    - id: tools.cmd.python
      kind: helpful
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.lint-fix:
    title: linter 的自动修复
    desc: 对「改了也不改变语义」的问题提供 safe fix；默认只报不改、--fix 应用安全修复、--unsafe-fixes 才动可能改语义的那些。
    kind: concept
    requires:
    - id: tools.quality.lint
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.lint-doc:
    title: 用规则代号查规则文档
    desc: 拿报告里的规则代号（F403、EM101……）查文档，弄清这条规则在防什么、为什么这种写法不好、怎么写更好。
    kind: skill
    requires:
    - id: tools.quality.lint-rule
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.lint-noqa:
    title: noqa
    desc: 写在源码行末的注释，让 linter 忽略这一行的某条规则；它跟着所在的那一行走。
    kind: term
    requires:
    - id: tools.quality.lint-rule
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.lint-exitcode:
    title: check 模式的退出码
    desc: 问题以非零退出码结束、全部通过输出 all checks passed 并以 0 结束，脚本、hook 和 CI 靠它判断成败。
    kind: concept
    requires:
    - id: tools.quality.lint
      kind: required
      by: 20260928-203521-tools-04-quality-r1
    - id: tools.shell.exitcode
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.coverage:
    title: 代码覆盖率
    desc: 跑测试时实现里有多少语句/行被真正执行过的度量；逐行报告指出哪些行没被测试走到。
    kind: concept
  tools.quality.regression-test:
    title: 回归测试
    desc: 发现 bug 之后专门为它写的测试：把触发它的输入固定下来，以后这个功能再坏掉会立刻被抓住。
    kind: concept
  tools.quality.property-testing:
    title: 基于属性的测试
    desc: 写下函数应该满足的性质，由测试库自动生成大量输入去验证；失败时给出具体反例，是部分规格而非证明。
    kind: concept
  tools.quality.precommit:
    title: pre-commit hook
    desc: Git 在每次 commit 之前自动运行的一段脚本；脚本以非零退出码结束就拒绝这次提交，pre-commit 框架把配置写进 .pre-commit-config.yaml。
    kind: term
    requires:
    - id: tools.cmd.git.commit
      kind: required
      by: 20260928-203521-tools-04-quality-r1
    - id: tools.shell.exitcode
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.ci:
    title: 持续集成（CI）
    desc: 一类服务：在远程机器上，每当仓库发生某些事件（push、pull request、按日程）就自动跑你配置的脚本。
    kind: term
    requires:
    - id: tools.shell.exitcode
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.cmd.git.push:
    title: git push
    desc: 把本地仓库里已经提交的快照送到远程仓库的命令。
    kind: term
    requires:
    - id: tools.cmd.git
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.ci-matrix:
    title: 测试矩阵
    desc: CI 配置里的一栏：把一个任务在所有参数组合（多个操作系统 × 多个语言版本）上各跑一遍，并行执行。
    kind: concept
    requires:
    - id: tools.quality.ci
      kind: required
      by: 20260928-203521-tools-04-quality-r1
  tools.quality.tool-config-by-example:
    title: 照相似项目学配置
    desc: 读一个语言、领域、规模都接近的开源项目的配置文件（pyproject.toml、.github/workflows/、DEVELOPMENT.md）来学怎么配。
    kind: skill
  tools.quality.ai-quality-loop:
    title: 用 AI 跑质量工具的闭环
    desc: 让 AI 助手能自己跑 linter/测试/覆盖率并看到结果、形成迭代闭环；产出要人工验收，因为高覆盖率不等于真的验证了功能。
    kind: concept
    requires:
    - id: tools.quality.coverage
      kind: required
      by: 20260928-203521-tools-04-quality-r1
    - id: tools.quality.lint
      kind: required
      by: 20260928-203521-tools-04-quality-r1
