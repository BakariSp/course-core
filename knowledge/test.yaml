# 知识图（D-020、D-047）：节点 + 先修关系。状态不写在这里，由证据算出（study.py kg）。
# requires 每条：id、kind（required 必须先会 / helpful 先会更好）、by（谁说的：运行 id 或 learner）。
# misconceptions：常见误解 id → desc（说明）、by（谁提的）；题目的得分点用它说明错在哪（D-056）。
topic: test
nodes:
  test.tools.pwd:
    title: pwd 命令
    desc: 打印当前工作目录完整路径的 shell 命令。
    kind: term
  test.tools.ls:
    title: ls 命令
    desc: 列出目录里文件名的 shell 命令。
    kind: term
    requires:
    - id: test.tools.pwd
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.tools.cat:
    title: cat 命令
    desc: 把文件内容原样打印到终端的程序。
    kind: term
  test.tools.echo:
    title: echo 命令
    desc: 把收到的文字原样打印到终端的 shell 命令。
    kind: term
  test.tools.redirect:
    title: 重定向（> 和 >>）
    desc: shell 在启动命令之前先把文件打开，把命令的输出送进文件而不是终端；> 覆盖，>> 追加。
    kind: concept
    requires:
    - id: test.tools.echo
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.tools.cp:
    title: cp 命令
    desc: 复制文件的 shell 命令，目标文件已存在时内容被覆盖。
    kind: term
  test.tools.python:
    title: python 命令
    desc: 解释器程序，执行它收到的 .py 文件里的语句。
    kind: term
  test.pytest.tool:
    title: pytest
    desc: 用 Python 写的测试运行器程序：按命名约定找出测试并逐个执行，最后报告哪些通过、哪些失败。
    kind: term
    requires:
    - id: test.tools.python
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.pytest.assert:
    title: assert 语句
    desc: Python 语句 assert 条件：条件为真时什么都不做，为假时抛 AssertionError，让这条测试失败。
    kind: concept
    requires:
    - id: test.tools.python
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.pytest.discovery:
    title: pytest 测试发现规则
    desc: pytest 默认找名字形如 test_*.py / *_test.py 的文件，执行里面名字以 test_ 开头的函数。
    kind: concept
    requires:
    - id: test.pytest.tool
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.pytest.failure_report:
    title: pytest 失败报告
    desc: FAILURES 段里的三段信息：失败的测试名、失败的断言原文、断言里各子表达式的实际值。
    kind: concept
    requires:
    - id: test.pytest.assert
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.pytest.exitcode:
    title: pytest 退出码
    desc: 程序结束时交给 shell 的整数：pytest 全绿是 0、有测试失败是 1，用 echo $? 查看。
    kind: concept
    requires:
    - id: test.pytest.tool
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.testing.mutation:
    title: 变异（改坏代码看测试是否报警）
    desc: 故意把被测代码改坏一处再跑测试，看测试会不会报警的一种验证手法。
    kind: concept
    requires:
    - id: test.pytest.assert
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
    - id: test.pytest.tool
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.testing.empty_test:
    title: 空测试
    desc: 没有断言或断言恒真、pytest 报 passed 却抓不住任何错误的测试。
    kind: concept
    requires:
    - id: test.pytest.assert
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.testing.convenient_input:
    title: 只喂了方便的输入
    desc: 测试用的数据对实现太宽松（如正好整除），实现改坏了这条测试也不会失败。
    kind: concept
    requires:
    - id: test.testing.empty_test
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.testing.red_first:
    title: 先让它红
    desc: 验证一条新测试真的在测东西：先指向已知坏掉的实现看它失败，再换回正确实现看它通过。
    kind: skill
    requires:
    - id: test.testing.mutation
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
    - id: test.pytest.assert
      kind: required
      by: 20260927-122048-test-01-batchelder-r1
  test.testing.automated:
    title: automated testing（自动化测试）
    desc: 用一段能反复运行的程序代替人手检查代码行为，是测试这件事的基础。
    kind: concept
    requires:
    - id: test.pytest.tool
      kind: helpful
      by: 20260928-200757-test-02-pytest-r7
  test.testing.ad_hoc:
    title: 在交互解释器里手动试
    desc: 打开 Python 交互解释器手动建对象、调方法、看结果——能验证代码，但不可重复。
    kind: skill
    requires:
    - id: test.testing.automated
      kind: required
      by: 20260928-200757-test-02-pytest-r7
    - id: test.tools.python
      kind: helpful
      by: 20260928-200757-test-02-pytest-r7
  test.testing.print_check:
    title: 打印期望值和实际值
    desc: 把检查写成脚本、把期望值和实际值都打印出来，换来可重复，但仍不告诉你对错。
    kind: skill
    requires:
    - id: test.testing.ad_hoc
      kind: required
      by: 20260928-200757-test-02-pytest-r7
  test.testing.anatomy:
    title: 一个测试的四个步骤（Arrange / Act / Assert / Cleanup）
    desc: 一个测试由准备、动作、断言、收尾四步组成，核心是 act 与 assert。
    kind: concept
    requires:
    - id: test.testing.automated
      kind: required
      by: 20260928-200757-test-02-pytest-r7
    - id: test.pytest.assert
      kind: helpful
      by: 20260928-200757-test-02-pytest-r7
  test.testing.error_vs_failure:
    title: 通过的 .、失败的 F、出错的 E
    desc: 断言失败（F）和测试自己冒出别的异常（E）是两种不同结果，要修的东西也不同。
    kind: concept
    requires:
    - id: test.pytest.failure_report
      kind: required
      by: 20260928-200757-test-02-pytest-r7
    - id: test.pytest.assert
      kind: helpful
      by: 20260928-200757-test-02-pytest-r7
  test.pytest.cli_options:
    title: pytest 的命令行短选项（-q / -v）
    desc: 跟在 pytest 后面改变运行器行为的短选项，-q 简短、-v 给细节。
    kind: term
    requires:
    - id: test.pytest.tool
      kind: required
      by: 20260928-200757-test-02-pytest-r7
  test.pytest.selection:
    title: 选择要运行哪些测试（node id / -k）
    desc: 用路径、`文件::函数名` 的 node id 或 -k 关键字表达式只跑指定的测试。
    kind: skill
    requires:
    - id: test.pytest.discovery
      kind: required
      by: 20260928-200757-test-02-pytest-r7
  test.pytest.raises:
    title: pytest.raises
    desc: 用 `with pytest.raises(异常类型):` 包住代码，断言它应该抛出异常。
    kind: term
    requires:
    - id: test.pytest.assert
      kind: required
      by: 20260928-200757-test-02-pytest-r7
    - id: test.testing.convenient_input
      kind: helpful
      by: 20260928-200757-test-02-pytest-r7
  test.pytest.fixture:
    title: fixture
    desc: pytest 按需提供给测试的资源：名字写进测试函数的参数，pytest 在跑测试前把它造好传进来。
    kind: term
    requires:
    - id: test.pytest.tool
      kind: required
      by: 20260928-200757-test-02-pytest-r7
  test.pytest.tmp_path:
    title: tmp_path fixture
    desc: pytest 的内置 fixture，给每条测试一个这次调用独有的临时目录（pathlib.Path）。
    kind: term
    requires:
    - id: test.pytest.fixture
      kind: required
      by: 20260928-200757-test-02-pytest-r7
