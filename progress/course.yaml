      - {id: sec-02-auth, title: 身份认证, sources: [{ref: portswigger, url: "https://portswigger.net/web-security/authentication"}]}
      - {id: sec-03-path, title: 路径穿越, sources: [{ref: portswigger, url: "https://portswigger.net/web-security/file-path-traversal"}]}
      - {id: sec-04-ssrf, title: SSRF, sources: [{ref: portswigger, url: "https://portswigger.net/web-security/ssrf"}]}
