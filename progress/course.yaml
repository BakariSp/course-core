# 课程定义（D-047）：阶段 → 学科 → 单元。你和规划老师都可以改；列表顺序就是学习顺序。
#
# 这里只写"学什么、看哪些材料、你有什么要求"。学没学完、备没备好都不写：它们由证据和备课记录算出。
# - sources：主课和材料。所有 url 的域名就是 agent 能打开的网站（白名单）。
# - 单元的 sources：这个单元看主课的哪一部分（ref 指向学科的 sources，url 是具体那一页）。
# - requests：你对这个单元的要求（写给备课老师），例如"想学 bisect""例子用我的项目"。
# - scope: open：范围还没定（一整门讲座、一个频道），系统不会备它，等你确认怎么拆。
# 原来的 curriculum.md（表格）和 syllabus.yaml 合并到了这里；课程原则和验证阶梯在 docs/curriculum-notes.md。

schema_version: 2
goal: 能设计、分析、验证一个学习类 AI 产品的全链路（前端 → 后端 → agent → 学习者模型 → 存储），知道每一段怎么运作、怎么优化、AI 写的对不对

# 终点（D-062，替换 D-048 的 C1–C5）：产品全链路地图。6 段（S，数据流经过的层）+ 3 个横切面（X）。
# 每一项都要能回答三问：机制（它怎么运作）/ 优化（慢在哪、会在哪坏、怎么改）/ 验证（AI 写了这段，怎么判断对不对）。
# 验收都在 cs-study 或 nanoteacher 的真实代码上做。路径按数据流和先修关系排。
destination:
  - id: S1
    can: 界面：组件和状态怎么组织、一次交互怎么变成请求、界面怎么按用户的心智模型设计
    accept: 在 cs-study 的 /app 上挑一个页面，说出数据从哪个接口来、状态放在哪、改一处会影响哪些组件；评一份 AI 写的界面改动
    units: [lang-02-react]
  - id: S2
    can: 网络：HTTP 请求与会话、TCP 长连接、SSE 怎么推流、断线怎么续
    accept: 讲清 cs-study 的 /api/flow/stream（Last-Event-ID 续推）和 nanoteacher 的聊天 SSE；解释为什么重启会断开所有 SSE、怎么改
    units: [net-01-overview, net-02-http, net-03-tcp, net-04-sse]
  - id: S3
    can: 后端服务：分层、端口、依赖注入；进程、线程、锁、async 在一次请求里各管什么
    accept: 在 cs-study 和 nanoteacher 上各走一遍一个功能经过哪几层、读写哪些数据；解释 4 个 worker 下为什么不能把跨请求状态放进程内字典
    units: [design-01-ousterhout, design-02-layers, os-01-process, os-02-thread, os-03-sync, lang-01-asyncio]
  - id: S4
    can: Agent 与 harness：prompt 怎么组装、上下文怎么配、工具怎么给、产出循环怎么收敛、怎么评测
    accept: 读 cs-study 的 harness 和备课循环，说出一次备课每一步的输入输出；为 LLM 负责的一步建评测，对比两版 prompt
    units: [agent-01-effective, tools-05-agentic, agent-02-capstone]
  - id: S5
    can: 学习者模型：学习数据怎么建模和储存、掌握度与知识点权重怎么更新、用什么算法、怎么知道算得准
    accept: 为"分析学习者的问题 → 找出知识点 → 更新掌握度"写设计文档（数据模型、算法、评测），经得起追问
    units: [lm-01-model, db-01-sqlbolt, agent-02-capstone]
  - id: S6
    can: 存储：SQL、事务与隔离级别、索引、并发控制、文件写入的崩溃一致性
    accept: 解释 SQLite WAL 下写锁什么时候成为瓶颈、atomic_write_text 为什么是临时文件 + rename；给一条慢查询说出该加什么索引
    units: [se-01-data, db-01-sqlbolt, db-02-index, db-03-txn, db-04-cc, os-04-fs]
  - id: X1
    can: 隔离与安全：每个请求都在后端鉴权、数据和文件按租户隔离、注入类漏洞
    accept: 在 nanoteacher 上审一个接口，指出隔离靠什么保证、哪里可能漏
    units: [net-02-http, db-01-sqlbolt, sec-01-access, sec-02-auth, sec-03-path, sec-04-ssrf, sec-05-tenant]
  - id: X2
    can: 性能与扩展：响应慢在哪一段、复杂度问题、从单机到多用户要改什么
    accept: 给 nanoteacher 的一次聊天请求量出各段耗时，指出瓶颈和改法；说出扩到 1 万用户先坏的是哪里
    units: [db-02-index, dsa-01, sysdesign-01]
  - id: X3
    can: 验证：测试、调试、护栏（架构测试、类型检查），判断 vibe coding 的结果是否可信
    accept: 把一份设计交给便宜模型实现，通过测试、架构测试、类型检查；故意塞一个越层写法，护栏拦得住
    units: [tools-01-shell, tools-02-git, tools-03-debug, test-01-batchelder, test-02-pytest, tools-04-quality, se-02-spec, se-03-legacy]

# 学习路线（D-062、D-064）：分阶段，每个阶段写它补终点地图的哪几段（fills）。学完、在学的在最前面（不动已学的）；
# 之后按数据流和先修排。没列进来的单元排在后面，在「课程设置」里。
# 先修：SSE 要 TCP 长连接和 async；并发控制要线程和锁；多租户审查要先会读分层；学习者模型要落到存储（事务）。
# D-068：「开发与架构设计」放在鉴权之后、后端运行之前——数据建模要先会 SQL；后面每个单元都用得上"数据怎么设计""对怎么定义"。
# 故意不学（D-068 审计，design/AUDIT-curriculum-coverage.md）：需求工程、项目管理（产品经理本职）；编译原理、形式化证明
# （验证 AI 代码用测试、类型、规格就够）；分片、一致性哈希、CAP 只到概念层（单机 SQLite）；前端工程化暂不学。
path:
  - title: 动手与验证：Shell、Git、调试、测试
    fills: [X3]
    units: [tools-01-shell, tools-02-git, tools-03-debug, test-01-batchelder, test-02-pytest]
  - title: 从请求到数据：HTTP 与 SQL
    fills: [S2, S6]
    units: [net-01-overview, net-02-http, db-01-sqlbolt]
  - title: 鉴权：访问控制与身份认证
    fills: [X1]
    units: [sec-01-access, sec-02-auth]
  - title: 开发与架构设计：数据、规格、模块、改造旧代码
    fills: [S6, X3, S3]
    units: [se-01-data, se-02-spec, design-01-ousterhout, design-02-layers, se-03-legacy]
  - title: 后端运行：进程、线程、异步
    fills: [S3]
    units: [os-01-process, os-02-thread, os-03-sync, lang-01-asyncio]
  - title: 长连接与推流：TCP 与 SSE
    fills: [S2]
    units: [net-03-tcp, net-04-sse]
  - title: 数据库进阶：索引、事务、并发控制、崩溃一致性、缓存
    fills: [S6, X2]
    units: [db-02-index, db-03-txn, db-04-cc, os-04-fs, sysdesign-01]
  - title: 多租户隔离：路径穿越、SSRF、隔离审查
    fills: [X1]
    units: [sec-03-path, sec-04-ssrf, sec-05-tenant]
  - title: AI 产品层：学习者模型、Agent、界面、验收项目
    fills: [S5, S4, S1, X3]
    units: [lm-01-model, agent-01-effective, tools-05-agentic, tools-04-quality, lang-02-react, agent-02-capstone]

stages:
  - id: verify
    title: 能验证
    weeks: [1, 8]
    pass: 能独立定位并修复一个线上 bug，全程自己验证
    practice: "学习 50 : 项目 50。给核心路径补测试；按红→绿修 bug；每个 PR 自己写 Test plan"
  - id: judge
    title: 能判断
    weeks: [9, 16]
    pass: 能写出一篇 ADR，列出 2-3 个方案和取舍，经得起追问
    practice: "学习 40 : 项目 60。端到端负责一个模块的重构：自己写设计文档，AI 只负责实现"
  - id: deliver
    title: 能交付
    weeks: [17, 24]
    pass: 能独立判断大改动的架构；连续几次晋升复盘都是绿灯
    practice: "学习 30 : 项目 70。把 SOP 文档化；和 cofounder 建立 eval 与灰度流程"

