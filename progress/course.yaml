    project_links:
      - {where: 重启会断开所有 SSE 连接, concept: 长连接、部署策略}
    units:
      - {id: net-01-overview, title: 第 1 章 概述, sources: [{ref: kurose, note: 第 1 章}]}
      - {id: net-02-http, title: 第 2 章 应用层与 HTTP, sources: [{ref: kurose, note: 第 2 章}], requests: [路径上跳过了第 1 章，用到的网络基础当场补]}
