    scope: shell、git / version control、调试与性能分析、代码质量、agentic coding（2026 版第 1、4、5、7、9 讲）
    sources:
      - {id: missing, title: MIT The Missing Semester of Your CS Education（2026 版官网）, url: "https://missing.csail.mit.edu/2026/", kind: course}
      - {id: missing-yt, title: Missing Semester YouTube 播放列表, url: "https://www.youtube.com/playlist?list=PLyzOVJj3bHQunmnnTXrNbZnBaCA-ieK4L", kind: video}
    units:
      - {id: tools-01-shell, title: Shell, sources: [{ref: missing, url: "https://missing.csail.mit.edu/2026/course-shell/"}]}
      - {id: tools-02-git, title: Git 与版本控制, sources: [{ref: missing, url: "https://missing.csail.mit.edu/2026/version-control/"}]}
      - {id: tools-03-debug, title: 调试与性能分析, sources: [{ref: missing, url: "https://missing.csail.mit.edu/2026/debugging-profiling/"}]}
      - {id: tools-04-quality, title: 代码质量, sources: [{ref: missing, url: "https://missing.csail.mit.edu/2026/code-quality/"}]}
      - {id: tools-05-agentic, title: Agentic Coding, sources: [{ref: missing, url: "https://missing.csail.mit.edu/2026/agentic-coding/"}]}

  - id: test
