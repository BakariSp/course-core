      - {id: pytest, title: pytest 官方教程, url: "https://docs.pytest.org/en/stable/getting-started.html", kind: page}
    units:
      - {id: test-01-batchelder, title: Getting Started Testing 演讲, sources: [{ref: batchelder}]}
      - {id: test-02-pytest, title: pytest 入门教程, sources: [{ref: pytest}]}

  - id: net
    title: Web 与网络
