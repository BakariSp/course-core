  - id: dist
    title: 分布式与数据系统
    priority: P1
    stage: judge
    goal: 能在存储、一致性、扩展方案之间做取舍
    scope: 全部（约 8 小时）
    sources:
      - {id: kleppmann, title: Martin Kleppmann · Distributed Systems（剑桥讲座播放列表）, url: "https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB", kind: video}
      - {id: ddia, title: DDIA 官网（参考书）, url: "https://dataintensive.net/", kind: book}
    project_links:
      - {where: JSON 要带 schema_version，字段只增不删, concept: 数据演进、向后兼容}
      - {where: Session JSONL 是 source of truth，SSE 只是预览, concept: 单一数据源、事件日志}
