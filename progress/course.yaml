      - {id: feathers-ai, title: "Michael Feathers · Working Effectively with Legacy Code and AI Coding Assistant（Tech Lead Journal #195）", url: "https://www.youtube.com/watch?v=mwVRHDD0tEk", kind: video}
      - {id: legacy-keypoints, title: The key points of Working Effectively with Legacy Code（understandlegacycode.com）, url: "https://understandlegacycode.com/blog/key-points-of-working-effectively-with-legacy-code/", kind: page}
    project_links:
      - {where: 记忆前后存过 5 种以上（MEMORY.md、TOPIC_MEMORY.md、GLOBAL_MEMORY.md、learning_state.json、topic_memory.json），失忆修了几十次, concept: 唯一的数据源、派生视图}
      - {where: 带学关不掉：当前页由游标和聊天历史两处推导，退出后被历史"复活", concept: 状态机、不变量}
      - {where: server.py 从 2102 行涨到 9464 行，前三个月只有 13 个测试文件, concept: 改造旧代码、先钉住现有行为}
    units:
      - id: se-01-data
        title: 数据建模：实体、唯一的数据源、派生数据
        sources: [{ref: cmu445-l1, note: 第 1 讲 Relational Model}, {ref: hi-data}, {ref: kleppmann-inside-out, note: 补充：唯一的数据源和派生数据}]
        requests:
          - 先给准确定义：数据模型、schema、实体、主键、关系、唯一的数据源（source of truth）、派生数据；再讲按访问模式设计、规范化与反规范化
          - 例子用 nanoteacher 的真实案例（导师从 git 历史整理并核对过，commit hash 原样引用，不要补充这里没有的细节）：失忆修了几十次，记忆前后存过 MEMORY.md、TOPIC_MEMORY.md、GLOBAL_MEMORY.md、learning_state.json、topic_memory.json 至少 5 种，每处各修各的；f2c70740（2026-06-20）新话题的记忆范围在创建时写死成"隔离"，读不到全局记忆；52dda43e（2026-07-03）量化后发现失忆主因是"学生的要求从没被写进记忆"，不是压缩丢了；sessions_completed 同时存在全局和每个话题两处，编号撞车（c2200756）
          - 练习：让学习者画 nanoteacher 记忆相关的数据地图——有哪些实体、各存在哪、谁写谁读、哪几处是同一份数据；再说出如果只留一个数据源，其他几处应该怎么从它派生
      - id: se-02-spec
        title: 规格、不变量与状态机
        sources: [{ref: mit6031, url: "https://web.mit.edu/6.031/www/sp21/classes/06-specifications/"}, {ref: mit6031, url: "https://web.mit.edu/6.031/www/sp21/classes/10-abstract-data-types/"}, {ref: mit6031, url: "https://web.mit.edu/6.031/www/sp21/classes/11-abstraction-functions-rep-invariants/"}]
        requests:
          - 主材料是 MIT 6.031 的三篇读物（学习者 2026-09-30 选定），原文例子是 Java，讲解时换成 Python，最好换成 nanoteacher 的例子
          - 核心问题是"没有规格就没有'对'的定义，也就没法验证 AI 写的对不对"：前置条件、后置条件、表示不变量（rep invariant）、抽象函数、状态机
          - 例子用 nanoteacher 的带学模式：退出只清游标，下一轮又从聊天历史重新锁上（e7e3b0c8，2026-07-01）→ 加退出水位线 → 轮中翻页、重读旧页又绕过（fb7aeb9d、af55aed1）→ 僵尸游标一天十几次死循环（0e36aff8，2026-08-07）。根因是"当前页"由游标和历史两处推导，没有显式状态机
          - 第二个例子：章节压缩活锁 20 天，幂等键只带起点、不带会话归属（8e664a05）——不变量没写全
          - 练习：为带学模式写出状态（未开始 / 带学中 / 已退出）、合法的状态转移和不变量，并说出 e7e3b0c8 的做法违反了哪条
      - id: se-03-legacy
        title: 改造旧代码：先钉住行为，再小步改
        sources: [{ref: feathers-ai}, {ref: legacy-keypoints}]
        requests:
          - 核心概念：legacy code = 没有测试的代码；characterization test（钉住代码现在的行为，不是它应该的行为）；seam（不改这一处就能改变行为的切入点）；小步重构；新旧实现并存时要有删除计划（strangler fig）
          - 例子用 nanoteacher：bb9bffcb（2026-04-13）i18n 合并悄悄丢了心跳修复，线上 8 天后才补回（e6504477）——如果有回归测试当场就红；9a30cdc8（2026-09-24）fixture 没导出，xfail 的测试体从来没执行，测试"绿"了却什么都没测；新旧记忆管线并存，最后靠 bc713570 集中删 882 行零引用代码
          - 练习：在 nanoteacher 上挑一个反复出现的 bug，先写一个钉住现有行为的测试，再说出修的时候从哪个切入点下手

