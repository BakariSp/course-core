# 觉得不对可以推翻。字段只能用下面这几个（界面和老师都认这几个名字）。
schema_version: 1

about:
  identity: 产品经理，做 AI 学习陪伴产品 nanoteacher（FastAPI + Next.js + SQLite，部署在 Linux 服务器上）
  background: 会一点代码，主要靠 AI 写代码（vibe coding），遇到过大量自己验证不了对错的 AI 代码
  starting_point: 2026-09-25 实测没有 shell 和操作系统基础。别默认我懂"程序""目录""家目录""标准输入"这类词；出现新术语当场拆一次
  goal: 能验证 AI 写的代码对不对、能独立判断架构、能交付稳定的产品。不是为了考试或面试
  style: 不爱自己看书；喜欢看视频课，看完马上做练习题检验
  machine: Windows 11。已装 Git for Windows（自带 Git Bash，已验证能用）、Windows Terminal、Python 3.14、Node.js。WSL 已装但还没有 Linux 发行版；Docker Desktop 已装但一般不开
  language: 中文为主，能读英文技术材料

time:
  session_minutes: 45          # 每次坐下来学多久；课程页按这个把小节分成一次次能学完的块
  unit_budget_minutes: 180     # 一个单元最多学多久
  max_new_terms: 5             # 每节最多几个新词（已经会的不算）
